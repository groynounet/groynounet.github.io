<style>
/* Concept : une carte plein écran, des pastilles de thème, des fiches qui montent du bas comme une app iOS.
   Accent : le bleu de four des porcelaines de Limoges. */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --surface-2:#e9edf5; --fg:#151a26; --muted:#5d6678;
  --line:#d7dce7; --accent:#1b3faa; --accent-ink:#ffffff; --accent-soft:#e3e9fa;
  --ok:#14843f; --warn:#c06a00; --bad:#c4312b; --star:#e2a100;
  --shadow:0 6px 24px rgba(20,30,60,.16);
  --f-display:"Bricolage Grotesque", ui-rounded, -apple-system, system-ui, sans-serif;
  --f-body:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --r:16px; --tabh:58px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11141c; --surface:#1a1f2b; --surface-2:#252b39; --fg:#eef1f7; --muted:#9aa3b6;
  --line:#2f3646; --accent:#7f9cff; --accent-ink:#0d1330; --accent-soft:#232c4a;
  --ok:#3fcf76; --warn:#f0a43a; --bad:#ff6b63; --star:#ffc93d;
  --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11141c; --surface:#1a1f2b; --surface-2:#252b39; --fg:#eef1f7; --muted:#9aa3b6;
  --line:#2f3646; --accent:#7f9cff; --accent-ink:#0d1330; --accent-soft:#232c4a;
  --ok:#3fcf76; --warn:#f0a43a; --bad:#ff6b63; --star:#ffc93d;
  --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Carte ---------- */
#map{position:fixed;inset:0;z-index:0;background:var(--surface-2)}
.leaflet-container{font:inherit;background:var(--surface-2)}
.leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--surface) 80%,transparent)!important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--muted)}
.leaflet-bottom{bottom:calc(var(--tabh) + var(--sab))}

/* ---------- En-tête carte ---------- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(var(--sat) + 8px) max(12px,var(--sar)) 8px max(12px,var(--sal));
  background:linear-gradient(var(--bg) 70%,color-mix(in srgb,var(--bg) 0%,transparent));display:flex;flex-direction:column;gap:8px}
.searchrow{display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:44px;box-shadow:var(--shadow)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;height:100%}
.search .i{color:var(--muted)}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(12px,var(--sal))) 0 calc(-1 * max(12px,var(--sal)));padding:2px max(12px,var(--sal))}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.chip .i{width:16px;height:16px}
.chip.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:#fff;font-weight:600}
.results{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:55vh;overflow:auto}
.results .row{border-bottom:1px solid var(--line)}
.results .row:last-child{border-bottom:0}
.empty-results{padding:14px;color:var(--muted)}

/* ---------- Barre flottante ---------- */
.floatbar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + var(--sab) + 26px);z-index:15;display:flex;align-items:center;gap:8px;padding:0 max(12px,var(--sar)) 0 max(12px,var(--sal));pointer-events:none}
.floatbar>*{pointer-events:auto}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-weight:600;font-size:14px}
.pill.on{background:var(--ok);border-color:var(--ok);color:#fff}
.pill.count{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;padding:0 12px}
.pill.cta{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.spacer{flex:1}
.locbtn{width:42px;height:42px;border-radius:50%;padding:0;justify-content:center}

/* ---------- Onglets ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--tabh) + var(--sab));padding:0 max(8px,var(--sar)) var(--sab) max(8px,var(--sal));
  display:flex;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted)}
.tab .i{width:24px;height:24px}
.tab.on{color:var(--accent);font-weight:600}

/* ---------- Vues plein écran ---------- */
.view{position:fixed;inset:0;bottom:calc(var(--tabh) + var(--sab));z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--sat) + 12px) max(16px,var(--sar)) 24px max(16px,var(--sal))}
.view h1{font:800 30px/1.1 var(--f-display);margin:6px 0 14px;letter-spacing:-.01em}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;margin-bottom:14px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.group{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);overflow:hidden;margin-bottom:16px}
.group .row{border-bottom:1px solid var(--line)}
.group .row:last-child{border-bottom:0}
.grouptitle{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 4px 6px;font-weight:600}
.hint{font-size:13px;color:var(--muted);margin:6px 4px 0}
.blank{padding:28px 18px;text-align:center;color:var(--muted)}
.blank .i{width:34px;height:34px;margin-bottom:8px;color:var(--accent)}
.blank b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}

/* ---------- Ligne de lieu ---------- */
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;text-align:left;background:transparent}
.row:active{background:var(--surface-2)}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.dot .i{width:17px;height:17px}
.rowmain{flex:1;min-width:0}
.rowtitle{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:5px;align-items:center}
.rowtitle .i{width:14px;height:14px;color:var(--star);fill:var(--star);stroke:var(--star)}
.rowsub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rownote{font-size:13px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dist{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.st{font-size:12px;font-weight:600}
.st.open{color:var(--ok)}.st.soon{color:var(--warn)}.st.closed{color:var(--bad)}.st.none{color:var(--muted);font-weight:400}

/* ---------- Feuille du bas ---------- */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(10,14,25,.38);opacity:0;transition:opacity .25s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.2);
  max-height:calc(100% - var(--sat) - 12px);height:var(--h,62%);display:flex;flex-direction:column;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1),height .25s ease;max-width:640px;margin:0 auto}
.sheet.show{transform:none}
.sheet.full{--h:calc(100% - var(--sat) - 12px)}
.grab{padding:8px 0 4px;display:grid;place-items:center;flex:none;touch-action:none}
.grab span{width:40px;height:5px;border-radius:3px;background:var(--line)}
.sheethead{display:flex;align-items:center;gap:8px;padding:0 max(16px,var(--sar)) 6px max(16px,var(--sal));flex:none}
.sheethead h2{flex:1;margin:0;font:800 22px/1.15 var(--f-display);text-wrap:balance;min-width:0}
.closebtn{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none}
.closebtn .i{width:16px;height:16px}
.sheetbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 max(16px,var(--sar)) calc(24px + var(--sab)) max(16px,var(--sal))}
.meta{color:var(--muted);margin-bottom:4px}
.statusline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:12px;font-weight:500;padding:4px 9px;border-radius:999px;background:var(--surface-2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;margin:14px 0 4px}
.tile{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px;border-radius:14px;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);font-size:12px;font-weight:600;text-decoration:none;text-align:center}
.tile .i{width:22px;height:22px}
.tile.on{background:var(--c);color:#fff}
.tile.on .i{fill:currentColor}
.tile.on .i.nofill{fill:none}
.hours{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.hours td{padding:9px 14px;border-bottom:1px solid var(--line)}
.hours tr:last-child td{border-bottom:0}
.hours td:last-child{text-align:right;color:var(--fg)}
.hours tr.today td{font-weight:700}
.hours td.off{color:var(--muted)!important}
.inforow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg);min-width:0}
.inforow:last-child{border-bottom:0}
.inforow .i{color:var(--accent)}
.inforow span{flex:1;min-width:0;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.smallbtn{font-size:13px;font-weight:600;color:var(--accent);padding:4px 8px;border-radius:8px;background:var(--accent-soft)}
textarea,.field input,.field select{width:100%;border:0;background:transparent;outline:none;font-size:16px;resize:none}
.notes{padding:12px 14px;min-height:76px;display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:14px;font-weight:700;background:var(--accent);color:var(--accent-ink);font-size:16px}
.btn.secondary{background:var(--surface);color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.linkrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);color:var(--accent);width:100%;text-align:left;font-weight:500;text-decoration:none}
.linkrow:last-child{border-bottom:0}
.field{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{width:92px;flex:none;color:var(--muted);font-size:14px}
.field input[type=datetime-local]{min-height:28px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.toggle:last-child{border-bottom:0}
.switch{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.toggle[aria-checked=true] .switch{background:var(--ok)}
.toggle[aria-checked=true] .switch::after{transform:translateX(20px)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .chip{justify-content:center}
.result{border:2px solid var(--accent);border-radius:var(--r);background:var(--surface);overflow:hidden;margin-top:12px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:.3}to{transform:none;opacity:1}}
.datebox{width:46px;text-align:center;flex:none}
.datebox small{display:block;font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase}
.datebox b{display:block;font:800 22px/1 var(--f-display)}
.datebox em{display:block;font-size:11px;font-style:normal;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + var(--sab) + 84px);transform:translateX(-50%) translateY(20px);z-index:90;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.loader{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:25;width:min(320px,calc(100% - 48px));background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:22px;text-align:center}
.loader b{display:block;font:800 18px/1.2 var(--f-display);margin:10px 0 6px}
.loader p{margin:0 0 12px;color:var(--muted);font-size:13px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.menu{position:fixed;top:calc(var(--sat) + 60px);right:max(12px,var(--sar));z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:250px;overflow:hidden}
.menu button,.menu div{display:flex;gap:10px;align-items:center;width:100%;padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}
.menu div{color:var(--muted);font-size:12px;display:block}
.menu>*:last-child{border-bottom:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

/* =====================================================================
   Sortir à Limoges — app web personnelle
   Données : © contributeurs OpenStreetMap (API Overpass), fond de carte CARTO.
   Tout ce qui est personnel (favoris, notes, agenda) reste dans ce navigateur.
   ===================================================================== */

// ---------- Thèmes ----------
const THEMES = {
  restos:   {label:"Restos",          color:"#e0662a"},
  bars:     {label:"Bars & cafés",    color:"#8a3ffc"},
  culture:  {label:"Culture",         color:"#9a6a2f"},
  nature:   {label:"Nature & balades",color:"#2f9b4a"},
  enfants:  {label:"Enfants",         color:"#e0457b"},
  sport:    {label:"Sport",           color:"#1f7fd6"},
  shopping: {label:"Shopping",        color:"#0f9a95"},
  soir:     {label:"Sorties du soir", color:"#4b4fd6"},
};
const THEME_KEYS = Object.keys(THEMES);

function classify(t){
  const r = []; const add = x => { if(!r.includes(x)) r.push(x); };
  const a=t.amenity||"", to=t.tourism||"", l=t.leisure||"", s=t.shop||"", h=t.historic||"";
  if(["restaurant","fast_food","ice_cream","food_court"].includes(a)) add("restos");
  else if(a==="cafe") add("bars");
  else if(["bar","pub","biergarten"].includes(a)){ add("bars"); add("soir"); }
  else if(a==="nightclub") add("soir");
  else if(["cinema","theatre"].includes(a)){ add("soir"); add("culture"); }
  else if(["arts_centre","library"].includes(a)) add("culture");
  else if(a==="marketplace") add("shopping");
  if(["museum","gallery","attraction"].includes(to)) add("culture");
  else if(to==="viewpoint") add("nature");
  else if(["zoo","theme_park","aquarium"].includes(to)) add("enfants");
  if(["park","garden","nature_reserve"].includes(l)) add("nature");
  else if(["playground","trampoline_park","miniature_golf","amusement_arcade","water_park"].includes(l)) add("enfants");
  else if(["sports_centre","swimming_pool","fitness_centre","climbing","stadium","ice_rink"].includes(l)) add("sport");
  else if(["bowling_alley","escape_game"].includes(l)){ add("soir"); add("enfants"); }
  if(l==="swimming_pool"||l==="ice_rink") add("enfants");
  if(s){ add("shopping"); if(s==="toys"||s==="games") add("enfants"); }
  if(h) add("culture");
  return r;
}

const LABELS = {
  "amenity=restaurant":"Restaurant","amenity=fast_food":"Restauration rapide","amenity=ice_cream":"Glacier","amenity=food_court":"Aire de restauration",
  "amenity=cafe":"Café","amenity=bar":"Bar","amenity=pub":"Pub","amenity=biergarten":"Brasserie en plein air","amenity=nightclub":"Discothèque",
  "amenity=cinema":"Cinéma","amenity=theatre":"Théâtre / salle de spectacle","amenity=arts_centre":"Centre culturel","amenity=library":"Bibliothèque",
  "amenity=marketplace":"Marché","tourism=museum":"Musée","tourism=gallery":"Galerie d'art","tourism=attraction":"À voir","tourism=viewpoint":"Point de vue",
  "tourism=zoo":"Parc animalier","tourism=theme_park":"Parc de loisirs","tourism=aquarium":"Aquarium","leisure=park":"Parc","leisure=garden":"Jardin",
  "leisure=nature_reserve":"Espace naturel","leisure=playground":"Aire de jeux","leisure=trampoline_park":"Parc de trampolines","leisure=miniature_golf":"Mini-golf",
  "leisure=amusement_arcade":"Salle de jeux","leisure=water_park":"Parc aquatique","leisure=sports_centre":"Centre sportif","leisure=swimming_pool":"Piscine",
  "leisure=fitness_centre":"Salle de sport","leisure=climbing":"Escalade","leisure=stadium":"Stade","leisure=ice_rink":"Patinoire","leisure=bowling_alley":"Bowling",
  "leisure=escape_game":"Escape game","shop=mall":"Centre commercial","shop=department_store":"Grand magasin","shop=books":"Librairie","shop=toys":"Jouets",

const CUISINES = {french:"française",regional:"régionale",italian:"italienne",pizza:"pizza",burger:"burgers",japanese:"japonaise",sushi:"sushis",
  chinese:"chinoise",vietnamese:"vietnamienne",thai:"thaïlandaise",indian:"indienne",lebanese:"libanaise",moroccan:"marocaine",turkish:"turque",

function categoryOf(t){
  for(const k of ["amenity","tourism","leisure"]) if(t[k] && LABELS[k+"="+t[k]]) return LABELS[k+"="+t[k]];
  if(t.shop) return LABELS["shop="+t.shop] || "Boutique";
  if(t.historic) return LABELS["historic="+t.historic] || "Patrimoine";
  return "Lieu";
}
function cuisineOf(t){
  if(!t.cuisine) return null;
  return t.cuisine.split(";").map(x=>{x=x.trim(); return CUISINES[x]||x.replace(/_/g," ");}).join(", ");
}
function addressOf(t){
  const l1=[t["addr:housenumber"],t["addr:street"]].filter(Boolean).join(" ");
  const city=t["addr:city"]||(t["addr:street"]?"Limoges":"");
  const l2=[t["addr:postcode"],city].filter(Boolean).join(" ");
  return [l1,l2].filter(Boolean).join(", ")||null;
}
function websiteOf(t){
  let s=t.website||t["contact:website"]||t.url; if(!s) return null;
  s=s.trim(); if(!/^https?:/i.test(s)) s="https://"+s;
  try{ return new URL(s).href; }catch{ return null; }
}
function phoneOf(t){ const p=t.phone||t["contact:phone"]; return p? p.split(";")[0].trim() : null; }
function featuresOf(t){
  const f=[]; const y=v=>v==="yes"||v==="only";
  if(t.outdoor_seating==="yes") f.push("Terrasse");
  if(y(t.takeaway)) f.push("À emporter");
  if(t.delivery==="yes") f.push("Livraison");
  if(t.wheelchair==="yes") f.push("Accessible PMR");
  if(y(t["diet:vegetarian"])) f.push("Végétarien");
  if(y(t["diet:vegan"])) f.push("Vegan");
  if(t.internet_access==="wlan"||t.internet_access==="yes") f.push("Wi-Fi");
  if(t.reservation==="required") f.push("Réservation obligatoire");
  if(t.fee==="no") f.push("Gratuit");
  return f;
}

// ---------- Horaires (format OpenStreetMap) ----------
const DAY_CODES=["Mo","Tu","We","Th","Fr","Sa","Su"];
const DAY_NAMES=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];

function parseHours(raw){
  const c=(raw||"").trim(); if(!c) return null;
  if(c==="24/7") return {always:true, days:Array.from({length:7},()=>[[0,1440]])};
  const res=Array.from({length:7},()=>[]);
  let i=0, any=false;
  let days=new Set(), times=[], off=false, hol=false, has=false;
  const commit=()=>{
    const touched=days.size||hol||has;
    if(touched && !(hol && !days.size)){
      const tgt=days.size? [...days] : [0,1,2,3,4,5,6];
      const sp= off? [] : (times.length? times.slice().sort((a,b)=>a[0]-b[0]) : [[0,1440]]);
      for(const d of tgt) res[d]=sp;
      any=true;
    }
    days=new Set(); times=[]; off=false; hol=false; has=false;
  };
  const isD=ch=>ch>="0"&&ch<="9";
  const isL=ch=>/\p{L}/u.test(ch);
  const sk=()=>{ while(i<c.length && c[i]===" ") i++; };
  const word=()=>{ let w=""; while(i<c.length && isL(c[i])) w+=c[i++]; return w; };
  const rt=()=>{
    let h=0,dg=0; while(i<c.length && isD(c[i]) && dg<2){ h=h*10+(+c[i]); i++; dg++; }
    if(!(dg>0 && i<c.length && (c[i]===":"||c[i]==="h"))) return null;
    i++; let m=0,md=0; while(i<c.length && isD(c[i]) && md<2){ m=m*10+(+c[i]); i++; md++; }
    if(h>48||m>59) return null; return h*60+m;
  };
  while(i<c.length){
    const ch=c[i];
    if(" ,\n\t".includes(ch)){ i++; continue; }
    if(ch===";"){ commit(); i++; continue; }
    if(ch==="|") return null;
    if(ch==='"'){ i++; while(i<c.length && c[i]!=='"') i++; i++; continue; }
    if(c.startsWith("24/7",i)){ times.push([0,1440]); has=true; i+=4; continue; }
    if(isD(ch)){
      const s=rt(); if(s===null) return null;
      sk(); let e=1440;
      if(c[i]==="-"){ i++; sk(); const e2=rt(); if(e2===null) return null; e=e2; if(c[i]==="+") i++; }
      else if(c[i]==="+"){ i++; e=Math.max(s+240,1440); }
      else return null;
      if(e<=s) e+=1440;
      times.push([s,e]); has=true; continue;
    }
    if(isL(ch)){
      const w=word(); const d=DAY_CODES.indexOf(w);
      if(d>=0){
        if(has) commit();
        const save=i; sk();
        if(c[i]==="-"){
          i++; sk(); const d2=DAY_CODES.indexOf(word()); if(d2<0) return null;
          let k=d; for(;;){ days.add(k); if(k===d2) break; k=(k+1)%7; }
        } else { i=save; days.add(d); }
        continue;
      }
      if(w==="PH"||w==="SH"){ if(has) commit(); hol=true; }
      else if(w==="off"||w==="closed"){ off=true; has=true; }
      else if(w==="open"){ /* rien */ }
      else return null;
      continue;
    }
    return null;
  }
  commit();
  return any? {always:false, days:res} : null;
}
const fmt=m=>{ const v=m===1440?1440:m%1440; return String(Math.floor(v/60)).padStart(2,"0")+":"+String(v%60).padStart(2,"0"); };
const dayIdx=(d=new Date())=>(d.getDay()+6)%7;

function statusOf(s, d=new Date()){
  if(!s) return {open:false, cls:"none", text:"Horaires non renseignés"};
  if(s.always) return {open:true, cls:"open", text:"Ouvert 24h/24"};
  const wd=dayIdx(d), m=d.getHours()*60+d.getMinutes();
  const openRes=cl=> cl-m<=30 ? {open:true,cls:"soon",text:"Ferme bientôt · "+fmt(cl)} : {open:true,cls:"open",text:"Ouvert · ferme à "+fmt(cl)};
  for(const sp of s.days[wd]) if(sp[0]<=m && m<sp[1]){
    if(sp[0]===0 && sp[1]===1440 && s.days[(wd+1)%7][0] && s.days[(wd+1)%7][0][0]===0) return {open:true,cls:"open",text:"Ouvert toute la journée"};
    return openRes(sp[1]);
  }
  const y=(wd+6)%7;
  for(const sp of s.days[y]) if(sp[1]>1440 && m+1440<sp[1]) return openRes(sp[1]-1440);
  for(let off=0; off<=7; off++){
    const dd=(wd+off)%7;
    for(const sp of s.days[dd].slice().sort((a,b)=>a[0]-b[0])) if(off>0 || sp[0]>m){
      const txt = off===0 ? "Fermé · ouvre à "+fmt(sp[0]) : off===1 ? "Fermé · ouvre demain à "+fmt(sp[0]) : "Fermé · ouvre "+DAY_NAMES[dd].toLowerCase()+" à "+fmt(sp[0]);
      return {open:false, cls:"closed", text:txt};
    }
  }
  return {open:false, cls:"closed", text:"Fermé"};
}
function dayLine(s,d){
  const sp=s.days[d]; if(!sp.length) return null;
  if(sp.length===1 && sp[0][0]===0 && sp[0][1]===1440) return "24h/24";
  return sp.map(x=>fmt(x[0])+"–"+fmt(x[1])).join(", ");
}

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200); }
function distM(p){ if(!state.loc) return null; const R=6371000,toR=Math.PI/180;
  const dLat=(p.lat-state.loc.lat)*toR, dLon=(p.lon-state.loc.lon)*toR;
  const a=Math.sin(dLat/2)**2+Math.cos(state.loc.lat*toR)*Math.cos(p.lat*toR)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a)); }
function distText(p){ const d=distM(p); if(d==null||d>50000) return ""; return d<1000? "à "+Math.round(d/10)*10+" m" : "à "+(d/1000).toLocaleString("fr-FR",{maximumFractionDigits:1})+" km"; }

const BBOX="45.78,1.18,45.89,1.34";
const ENDPOINTS=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://maps.mail.ru/osm/tools/overpass/api/interpreter"];
const QUERY=`[out:json][timeout:120];
(
  nwr["amenity"~"^(restaurant|fast_food|ice_cream|food_court|cafe|bar|pub|biergarten|nightclub|cinema|theatre|arts_centre|library|marketplace)$"]["name"](${BBOX});
  nwr["tourism"~"^(museum|gallery|attraction|viewpoint|zoo|theme_park|aquarium)$"]["name"](${BBOX});
  nwr["leisure"~"^(park|garden|nature_reserve|playground|trampoline_park|miniature_golf|amusement_arcade|water_park|sports_centre|swimming_pool|fitness_centre|climbing|stadium|ice_rink|bowling_alley|escape_game)$"]["name"](${BBOX});
  nwr["shop"~"^(mall|department_store|books|toys|games|clothes|shoes|chocolate|pastry|cheese|wine|deli|music|gift|art|antiques|second_hand|bicycle|sports|confectionery|tea|coffee|farm|craft)$"]["name"](${BBOX});
  nwr["historic"~"^(monument|castle|church|memorial|ruins|archaeological_site)$"]["name"](${BBOX});
);
out center tags;`;

function prepare(raw){
  const list=[]; const map=new Map();
  for(const r of raw){
    const themes=classify(r.tags); if(!themes.length) continue;
    const p={...r, themes, sched:parseHours(r.tags.opening_hours), cat:categoryOf(r.tags), cuisine:cuisineOf(r.tags)};
    p.search=norm([p.name,p.cat,p.cuisine,r.tags["addr:street"]].join(" "));
    list.push(p); map.set(p.id,p);
  }
  list.sort((a,b)=>a.name.localeCompare(b.name,"fr"));
  state.places=list; state.byId=map;
}

async function fetchPlaces(){
  let lastErr;
  for(const url of ENDPOINTS){
    try{
      const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),150000);
      const r=await fetch(url,{method:"POST",body:"data="+encodeURIComponent(QUERY),headers:{"Content-Type":"application/x-www-form-urlencoded"},signal:ctrl.signal});
      clearTimeout(to);
      if(!r.ok) throw new Error("HTTP "+r.status);
      const j=await r.json(); const seen=new Set(); const out=[];
      for(const el of j.elements||[]){
        const t=el.tags; if(!t||!t.name) continue;
        const lat=el.lat??el.center?.lat, lon=el.lon??el.center?.lon; if(lat==null||lon==null) continue;
        const key=t.name.toLowerCase()+"|"+Math.round(lat*2000)+"|"+Math.round(lon*2000);
        if(seen.has(key)) continue; seen.add(key);
        out.push({id:el.type+"/"+el.id, name:t.name, lat, lon, tags:t});
      }
      if(out.length) return out;
    }catch(e){ lastErr=e; }
  }
  throw lastErr||new Error("vide");
}

async function loadPlaces(force=false){
  if(!force && !state.places.length){
    const cache=await idb.get("places");
    if(cache && cache.places && cache.places.length){
      prepare(cache.places); state.lastUpdate=cache.date; refreshAll();
      if(Date.now()-cache.date < 7*24*3600*1000) return;
    }
  }
  if(state.loading) return;
  state.loading=true; state.error=null; renderLoader();
  try{
    const raw=await fetchPlaces();
    prepare(raw); state.lastUpdate=Date.now();
    await idb.set("places",{date:state.lastUpdate, places:raw});
    if(force) toast(state.places.length+" lieux mis à jour");
  }catch(e){
    state.error = state.places.length ? "Mise à jour impossible pour l'instant. Les lieux déjà enregistrés restent disponibles." : "Impossible de charger les lieux. Vérifie ta connexion puis réessaie.";
    if(state.places.length) toast("Mise à jour impossible pour l'instant");
  }
  state.loading=false; renderLoader(); refreshAll();
}

function themeColorFor(p){
  if(fav(p.id)) return "#e2a100";
  if(state.themes.size===1){ const t=[...state.themes][0]; if(p.themes.includes(t)) return THEMES[t].color; }
  return THEMES[p.themes[0]].color;
}
function filtered(){
  return state.places.filter(p=>
    (!state.themes.size || p.themes.some(t=>state.themes.has(t))) &&
    (!state.openNow || statusOf(p.sched).open));

function renderMarkers(){
  markerLayer.clearLayers();

  for(const p of list){
    ids.add(p.id);

    const m=L.circleMarker([p.lat,p.lon],{radius:sel?11:(fav(p.id)?8:6.5),color:"#fff",weight:sel?3:1.6,fillColor:themeColorFor(p),fillOpacity:.95,bubblingMouseEvents:false});
    m.on("click",()=>openPlace(p.id));

    const p=state.byId.get(state.selected);

// Position
function startLocation(center){
  if(!navigator.geolocation){ toast("Position indisponible sur cet appareil"); return; }
  let first=true;
  navigator.geolocation.watchPosition(pos=>{
    state.loc={lat:pos.coords.latitude, lon:pos.coords.longitude};
    const ll=[state.loc.lat,state.loc.lon];
    if(!userMarker){
      userHalo=L.circle(ll,{radius:pos.coords.accuracy,color:"#2b7bff",weight:0,fillOpacity:.12,interactive:false}).addTo(map);
      userMarker=L.circleMarker(ll,{radius:7,color:"#fff",weight:3,fillColor:"#2b7bff",fillOpacity:1,interactive:false}).addTo(map);
    } else { userMarker.setLatLng(ll); userHalo.setLatLng(ll).setRadius(pos.coords.accuracy); }
    if(center && first){ map.flyTo(ll,16,{duration:.8}); }
    first=false;
  },err=>{ if(center) toast(err.code===1? "Autorise la localisation dans Réglages › Safari" : "Position introuvable pour l'instant"); },
  {enableHighAccuracy:true,maximumAge:30000,timeout:15000});
}
let locStarted=false;
$("#locBtn").addEventListener("click",()=>{
  if(state.loc){ map.flyTo([state.loc.lat,state.loc.lon],16,{duration:.8}); return; }
  if(!locStarted){ locStarted=true; startLocation(true); }
});
// Si la permission est déjà accordée, on démarre en silence
navigator.permissions?.query({name:"geolocation"}).then(r=>{ if(r.state==="granted"){ locStarted=true; startLocation(false); } }).catch(()=>{});

function openSheet({head,body,modal=false,full=false,ctx}){
  sheetCtx=ctx||null;
  $("#sheethead").innerHTML=head; $("#sheetbody").innerHTML=body; $("#sheetbody").scrollTop=0;
  sheet.hidden=false; sheet.classList.toggle("full",full);
  sheet.setAttribute("aria-modal",modal);
  backdrop.hidden=!modal;
  requestAnimationFrame(()=>{ sheet.classList.add("show"); if(modal) backdrop.classList.add("show"); });
}
function closeSheet(){
  sheet.classList.remove("show"); backdrop.classList.remove("show");
  const wasPlace=sheetCtx&&sheetCtx.type==="place";
  sheetCtx=null;
  setTimeout(()=>{ if(!sheet.classList.contains("show")){ sheet.hidden=true; backdrop.hidden=true; } },300);
  if(wasPlace || state.selected){ state.selected=null; renderMarkers(); }
}
backdrop.addEventListener("click",closeSheet);
$("#grab").addEventListener("click",()=>sheet.classList.toggle("full"));
(function dragSheet(){
  let y0=null,t0=0;
  $("#grab").addEventListener("touchstart",e=>{y0=e.touches[0].clientY;t0=Date.now();},{passive:true});
  $("#grab").addEventListener("touchend",e=>{
    if(y0==null) return; const dy=e.changedTouches[0].clientY-y0; y0=null;
    if(dy>60){ sheet.classList.contains("full")? sheet.classList.remove("full") : closeSheet(); }
    else if(dy<-40) sheet.classList.add("full");
  });
})();
$("#sheetbody").addEventListener("scroll",e=>{ if(e.target.scrollTop>40 && sheetCtx&&sheetCtx.type==="place") sheet.classList.add("full"); },{passive:true});
const headHTML=(title,back)=>`${back?`<button class="closebtn" data-act="back" aria-label="Retour">${icon("back")}</button>`:""}<h2>${esc(title)}</h2><button class="closebtn" data-act="close" aria-label="Fermer">${icon("x")}</button>`;

// ---------- Fiche lieu ----------
function openPlace(id,opt={}){
  const p=state.byId.get(id); if(!p) return;
  state.selected=id; renderMarkers();
  if(opt.fly || state.tab==="map"){
    if(state.tab!=="map") switchTab("map");
    const targetZoom=Math.max(map.getZoom(),16);
    const pt=map.project([p.lat,p.lon],targetZoom).add([0,map.getSize().y*0.22]);
    map.flyTo(map.unproject(pt,targetZoom),targetZoom,{duration:opt.fly?.8:.4});
  }
  renderPlace(p);
}
function renderPlace(p,keepScroll){
  const t=p.tags, st=statusOf(p.sched), d=distText(p), today=dayIdx();
  const phone=phoneOf(t), web=websiteOf(t), addr=addressOf(t), feats=featuresOf(t);
  const tel=phone? phone.replace(/[^\d+]/g,"") : "";
  const ll=p.lat+","+p.lon;
  const route=`https://maps.apple.com/?daddr=${ll}&q=${encodeURIComponent(p.name)}`;
  const plans=`https://maps.apple.com/?q=${encodeURIComponent(p.name)}&ll=${ll}&z=18`;
  const visited=state.user.visited[p.id];
  const tile=(act,ic,label,c,on)=>`<button class="tile ${on?"on":""}" data-act="${act}" style="--c:${c}" aria-pressed="${!!on}">${icon(ic,ic==="check"?"nofill":"")}${label}</button>`;
  const link=(href,ic,label,c)=>`<a class="tile" href="${esc(href)}" target="_blank" rel="noopener" style="--c:${c}">${icon(ic,"nofill")}${label}</a>`;

  let hours;
  if(p.sched){
    hours=`<div class="group"><table class="hours"><tbody>${DAY_NAMES.map((n,i)=>{const l=dayLine(p.sched,i);
      return `<tr class="${i===today?"today":""}"><td>${n}</td><td class="${l?"":"off"}">${l||"Fermé"}</td></tr>`;}).join("")}</tbody></table></div>
      <p class="hint">Jours fériés et fermetures exceptionnelles non pris en compte.</p>`;
  } else if(t.opening_hours){
    hours=`<div class="group"><div class="inforow"><span>${esc(t.opening_hours)}</span></div></div>`;
  } else {
    hours=`<p class="hint">Pas d'horaires dans la base. Touche « Plans » pour voir la fiche Apple Plans, souvent plus complète.</p>`;
  }

  const body=`
    <div class="meta">${esc([p.cat,p.cuisine&&("Cuisine "+p.cuisine)].filter(Boolean).join(" · "))}</div>
    <div class="statusline"><span class="st ${st.cls}" style="font-size:14px">${esc(st.text)}</span>${d?`<span class="dist" style="font-size:14px">· ${d}</span>`:""}</div>
    ${feats.length?`<div class="tags">${feats.map(f=>`<span class="tag">${esc(f)}</span>`).join("")}</div>`:""}
    <div class="tiles">
      ${link(route,"route","Itinéraire","#1f7fd6")}
      ${tel?link("tel:"+tel,"phone","Appeler","#14843f"):""}
      ${web?link(web,"globe","Site web","#0f9a95"):""}
      ${link(plans,"photo","Plans","#e0662a")}
    </div>
    <div class="grouptitle">Ma liste</div>
    <div class="tiles" style="margin-top:0">
      ${tile("fav","star","Favori","#e2a100",fav(p.id))}
      ${tile("totry","bookmark","À tester","var(--accent)",toTry(p.id))}
      ${tile("visited","check",visited?"Fait le "+new Date(visited).toLocaleDateString("fr-FR",{day:"numeric",month:"short"}):"Déjà fait","#14843f",!!visited)}
    </div>
    <div class="grouptitle">Horaires</div>
    ${hours}
    ${(addr||phone||web)?`<div class="grouptitle">Infos</div><div class="group">
      ${addr?`<div class="inforow">${icon("pin")}<span>${esc(addr)}</span><button class="smallbtn" data-act="copy" data-copy="${esc(addr)}">Copier</button></div>`:""}
      ${phone?`<a class="inforow" href="tel:${esc(tel)}">${icon("phone")}<span>${esc(phone)}</span></a>`:""}
      ${web?`<a class="inforow" href="${esc(web)}" target="_blank" rel="noopener">${icon("globe")}<span>${esc(new URL(web).host.replace(/^www\./,""))}</span></a>`:""}
    </div>`:""}
    <div class="grouptitle">Mes notes</div>
    <div class="group"><textarea class="notes" id="noteInput" rows="3" placeholder="Ex. : super burger, réserver le samedi…">${esc(state.user.notes[p.id]||"")}</textarea></div>
    <div class="group" style="margin-top:16px">
      <button class="linkrow" data-act="plan">${icon("calplus")}Prévoir une sortie ici</button>
      ${state.tab!=="map"?`<button class="linkrow" data-act="onmap">${icon("map")}Voir sur la carte</button>`:""}
      <a class="linkrow" href="https://www.openstreetmap.org/${esc(p.id)}" target="_blank" rel="noopener" style="font-size:14px">${icon("pencil")}Une info fausse ? Corriger sur OpenStreetMap</a>
    </div>`;
  const scroll=$("#sheetbody").scrollTop;
  openSheet({head:headHTML(p.name), body, ctx:{type:"place", id:p.id}, full:sheet.classList.contains("full")&&keepScroll});
  if(keepScroll) $("#sheetbody").scrollTop=scroll;
  const ni=$("#noteInput");
  ni.addEventListener("input",()=>{ const v=ni.value; if(v.trim()) state.user.notes[p.id]=v; else delete state.user.notes[p.id]; saveUser(); });
}

// Actions dans la feuille
sheet.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, ctx=sheetCtx||{};
  if(act==="close") return closeSheet();
  if(act==="back" && ctx.back) return ctx.back();
  if(ctx.type==="place"){
    const p=state.byId.get(ctx.id);
    if(act==="fav"){ toggleIn(state.user.fav,p.id); saveUser(); renderPlace(p,true); renderMarkers(); }
    if(act==="totry"){ toggleIn(state.user.toTry,p.id); saveUser(); renderPlace(p,true); }
    if(act==="visited"){ if(state.user.visited[p.id]) delete state.user.visited[p.id]; else { state.user.visited[p.id]=Date.now(); state.user.toTry=state.user.toTry.filter(x=>x!==p.id); } saveUser(); renderPlace(p,true); }
    if(act==="copy"){ try{ await navigator.clipboard.writeText(b.dataset.copy); toast("Adresse copiée"); }catch{ toast("Copie impossible"); } }
    if(act==="onmap"){ return openPlace(p.id,{fly:true}); }
    if(act==="plan"){ openOutingEditor({title:p.name, placeId:p.id, placeName:p.name}, ()=>renderPlace(p)); }
    if(state.tab!=="map") refreshAll();
  }
  if(ctx.type==="random") randomAction(act,b);
  if(ctx.type==="outing") outingAction(act,b);
});

// ---------- « On fait quoi ? » ----------
const rnd={theme:"restos", openNow:true, skipVisited:false, preferToTry:true, km:0, result:null, rolls:0};
function candidates(){
  return state.places.filter(p=>{
    if(rnd.theme && !p.themes.includes(rnd.theme)) return false;
    if(rnd.openNow && !statusOf(p.sched).open) return false;
    if(rnd.skipVisited && state.user.visited[p.id]) return false;
    if(rnd.km && state.loc){ const d=distM(p); if(d!=null && d>rnd.km*1000) return false; }
    return true;
  });
}
function openRandom(){ rnd.result=null; rnd.rolls=0; renderRandom(); }
function renderRandom(){
  const n=candidates().length;
  const tg=(key,label)=>`<button class="toggle" data-act="tg" data-key="${key}" role="switch" aria-checked="${!!rnd[key]}"><span>${label}</span><span class="switch"></span></button>`;
  const r=rnd.result && state.byId.get(rnd.result);
  const body=`
    <div class="grouptitle" style="margin-top:4px">Envie de…</div>
    <div class="grid2">
      <button class="chip ${rnd.theme?"":"on"}" data-act="rt" data-theme="" style="--c:#5d6678">${icon("dice")}Surprise</button>
      ${THEME_KEYS.map(k=>`<button class="chip ${rnd.theme===k?"on":""}" data-act="rt" data-theme="${k}" style="--c:${THEMES[k].color}">${icon(k)}${THEMES[k].label}</button>`).join("")}
    </div>
    <div class="group" style="margin-top:16px">
      ${tg("openNow","Ouvert maintenant")}
      ${tg("skipVisited","Exclure ce que j'ai déjà fait")}
      ${tg("preferToTry","Priorité à ma liste « à tester »")}
    </div>
    ${state.loc?`<div class="seg">${[0,1,3,5].map(k=>`<button data-act="km" data-km="${k}" class="${rnd.km===k?"on":""}">${k?k+" km":"Peu importe"}</button>`).join("")}</div>`:""}
    <p class="hint" style="margin-bottom:14px">${n} lieu${n>1?"x":""} possible${n>1?"s":""}${rnd.openNow?" (seuls les lieux aux horaires connus comptent)":""}.</p>
    <button class="btn" data-act="roll">${icon("dice")}${r?"Relancer":"Tirer au sort"}</button>
    ${r?`<div class="result">${rowHTML(r)}<div class="group" style="margin:0;border:0;border-top:1px solid var(--line);border-radius:0">
        <button class="linkrow" data-act="show" data-id="${esc(r.id)}">${icon("map")}Voir la fiche et la carte</button></div></div>
        ${toTry(r.id)?`<p class="hint">Dans ta liste « à tester ».</p>`:""}`
      : (rnd.rolls? `<p class="hint" style="margin-top:12px">Rien ne correspond. Enlève « Ouvert maintenant » ou élargis la distance.</p>`:"")}`;
  openSheet({head:headHTML("On fait quoi ?"), body, modal:true, full:true, ctx:{type:"random"}});
}
function randomAction(act,b){
  if(act==="rt"){ rnd.theme=b.dataset.theme||null; renderRandom(); }
  if(act==="tg"){ rnd[b.dataset.key]=!rnd[b.dataset.key]; renderRandom(); }
  if(act==="km"){ rnd.km=+b.dataset.km; renderRandom(); }
  if(act==="roll"){
    let pool=candidates();
    if(rnd.preferToTry){ const pr=pool.filter(p=>toTry(p.id)); if(pr.length) pool=pr; }
    if(pool.length>1 && rnd.result) pool=pool.filter(p=>p.id!==rnd.result);
    rnd.result = pool.length ? pool[Math.floor(Math.random()*pool.length)].id : null;
    rnd.rolls++; renderRandom(); navigator.vibrate?.(15);
  }
  if(act==="show"){ openPlace(b.dataset.id,{fly:true}); }
}

// ---------- Mes lieux ----------
let listFilter="fav", listOpenOnly=false;
const LISTS={fav:["Favoris","star","Touche l'étoile sur la fiche d'un lieu pour le retrouver ici."],
  toTry:["À tester","bookmark","Ajoute ici les endroits qui te font envie, puis laisse « On fait quoi ? » choisir."],
  visited:["Déjà faits","check","Marque « Déjà fait » sur une fiche : la date est enregistrée."],
  notes:["Notés","pencil","Les lieux sur lesquels tu as écrit une note apparaîtront ici."]};
function renderList(){
  const u=state.user; let ids;
  if(listFilter==="fav") ids=u.fav.slice();
  else if(listFilter==="toTry") ids=u.toTry.slice();
  else if(listFilter==="visited") ids=Object.keys(u.visited).sort((a,b)=>u.visited[b]-u.visited[a]);
  else ids=Object.keys(u.notes);
  let items=ids.map(id=>state.byId.get(id)).filter(Boolean);
  if(listFilter!=="visited") items.sort((a,b)=>a.name.localeCompare(b.name,"fr"));
  if(listOpenOnly) items=items.filter(p=>statusOf(p.sched).open);
  const [title,ic,emptyTxt]=LISTS[listFilter];
  $("#view-list").innerHTML=`
    <h1>Mes lieux</h1>
    <div class="seg">${Object.entries(LISTS).map(([k,v])=>`<button data-lf="${k}" class="${listFilter===k?"on":""}">${v[0]}</button>`).join("")}</div>
    <div class="group"><button class="toggle" data-oo role="switch" aria-checked="${listOpenOnly}"><span>Seulement ce qui est ouvert</span><span class="switch"></span></button></div>
    ${items.length? `<div class="group">${items.map(p=>rowHTML(p,{note:true,extra: listFilter==="visited"?`<span class="rownote">Fait le ${new Date(u.visited[p.id]).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})}</span>`:""})).join("")}</div>`
      : `<div class="group blank">${icon(ic)}<b>${listOpenOnly?"Rien d'ouvert pour l'instant":"Liste vide"}</b>${listOpenOnly?"Désactive le filtre pour tout voir.":emptyTxt}</div>`}
    ${!state.places.length && ids.length? `<p class="hint">Les lieux se chargent…</p>`:""}`;
}
$("#view-list").addEventListener("click",e=>{
  const lf=e.target.closest("[data-lf]"); if(lf){ listFilter=lf.dataset.lf; renderList(); return; }
  if(e.target.closest("[data-oo]")){ listOpenOnly=!listOpenOnly; renderList(); return; }
  const o=e.target.closest("[data-open]"); if(o) openPlace(o.dataset.open);
});

const LINKS=[
  ["Sortir à Limoges","L'agenda des événements de la Ville","https://sortir.limoges.fr"],
  ["Office de tourisme","Visites, balades et bons plans","https://www.destination-limoges.com"],

  ["JDS Limoges","Concerts, spectacles, expos, cinéma","https://www.jds.fr/limoges/agenda"],
];
let showPast=false;
function outingRow(o,dim){
  const d=new Date(o.date);
  return `<button class="row" data-outing="${o.id}" style="${dim?"opacity:.6":""}">
    <span class="datebox"><small>${d.toLocaleDateString("fr-FR",{weekday:"short"}).replace(".","")}</small><b>${d.getDate()}</b><em>${d.toLocaleDateString("fr-FR",{month:"short"})}</em></span>
    <span class="rowmain"><span class="rowtitle">${esc(o.title||"Sortie")}</span>
      <span class="rowsub" style="display:block">${d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}${o.placeName&&o.placeName!==o.title?" · "+esc(o.placeName):""}</span>
      ${o.notes?`<span class="rownote">${esc(o.notes)}</span>`:""}</span>
  </button>`;
}
function renderAgenda(){
  const start=new Date(); start.setHours(0,0,0,0);
  const all=state.user.outings;
  const up=all.filter(o=>o.date>=start.getTime()).sort((a,b)=>a.date-b.date);
  const past=all.filter(o=>o.date<start.getTime()).sort((a,b)=>b.date-a.date);
  $("#view-agenda").innerHTML=`
    <div style="display:flex;align-items:center;gap:10px"><h1 style="flex:1">Agenda</h1>
      <button class="iconbtn" data-new aria-label="Nouvelle sortie" style="box-shadow:none">${icon("plus")}</button></div>
    <div class="grouptitle" style="margin-top:0">À venir</div>
    ${up.length? `<div class="group">${up.map(o=>outingRow(o)).join("")}</div>`
      : `<div class="group blank">${icon("cal")}<b>Aucune sortie prévue</b>Touche + ou « Prévoir une sortie ici » sur la fiche d'un lieu.</div>`}
    ${past.length? `<div class="group"><button class="linkrow" data-past>${showPast?"Masquer":"Voir"} les sorties passées (${past.length})</button>${showPast?past.map(o=>outingRow(o,true)).join(""):""}</div>`:""}
    <div class="grouptitle">Trouver des idées</div>
    <div class="group">${LINKS.map(l=>`<a class="inforow" href="${l[2]}" target="_blank" rel="noopener"><span><b style="display:block;font-weight:600">${l[0]}</b><span style="color:var(--muted);font-size:13px">${l[1]}</span></span>${icon("ext")}</a>`).join("")}</div>
    <p class="hint">Repère un concert ou un spectacle, ajoute-le avec +, puis « Ajouter au calendrier » pour avoir l'alerte de ton iPhone.</p>`;
}
$("#view-agenda").addEventListener("click",e=>{
  if(e.target.closest("[data-new]")) return openOutingEditor({});
  if(e.target.closest("[data-past]")){ showPast=!showPast; return renderAgenda(); }
  const o=e.target.closest("[data-outing]"); if(o){ const x=state.user.outings.find(z=>z.id===o.dataset.outing); if(x) openOutingEditor(x); }
});

// Édition d'une sortie
let draft=null, draftBack=null, pickerQuery="";
function defaultDate(){ const d=new Date(); d.setHours(20,0,0,0); if(d<new Date()) d.setDate(d.getDate()+1); return d.getTime(); }
const toLocalInput=ms=>{ const d=new Date(ms); const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
function openOutingEditor(o,back){
  const existing=o.id && state.user.outings.some(x=>x.id===o.id);
  draft=Object.assign({id:o.id||("o"+Date.now().toString(36)), title:"", date:defaultDate(), placeId:null, placeName:"", notes:"", alarm:"eve"}, o, {_new:!existing});
  draftBack=back||null; renderOutingEditor();
}
function renderOutingEditor(){
  const p=draft.placeId && state.byId.get(draft.placeId);
  const body=`
    <div class="group">
      <div class="field"><label for="o-title">Titre</label><input id="o-title" value="${esc(draft.title)}" placeholder="Concert au Zénith…"></div>
      <div class="field"><label for="o-date">Quand</label><input id="o-date" type="datetime-local" value="${toLocalInput(draft.date)}"></div>
    </div>
    <div class="grouptitle">Lieu</div>
    <div class="group">
      ${p? rowHTML(p)+`<button class="linkrow" data-act="unplace" style="color:var(--bad)">${icon("x")}Retirer ce lieu</button>`
         : `<div class="field"><label for="o-place">Lieu</label><input id="o-place" value="${esc(draft.placeName)}" placeholder="Texte libre"></div>`}
      <button class="linkrow" data-act="pick">${icon("pin")}Choisir parmi les lieux de Limoges</button>
    </div>
    <div class="grouptitle">Alerte dans le calendrier</div>
    <div class="seg">${[["none","Aucune"],["2h","2 h avant"],["eve","La veille 18 h"]].map(([k,l])=>`<button data-act="alarm" data-alarm="${k}" class="${draft.alarm===k?"on":""}">${l}</button>`).join("")}</div>
    <div class="grouptitle" style="margin-top:4px">Notes</div>
    <div class="group"><textarea class="notes" id="o-notes" rows="3" placeholder="Billets, avec qui, à prévoir…">${esc(draft.notes)}</textarea></div>
    <div style="display:grid;gap:10px;margin-top:6px">
      <button class="btn" data-act="save">Enregistrer</button>
      <button class="btn secondary" data-act="ics">${icon("bell")}Ajouter au calendrier de l'iPhone</button>
      ${!draft._new? `<button class="btn danger" data-act="delete">${icon("trash")}Supprimer la sortie</button>`:""}
    </div>`;
  openSheet({head:headHTML(draft._new?"Nouvelle sortie":"Sortie", !!draftBack), body, modal:true, full:true, ctx:{type:"outing", back:()=>{ const b=draftBack; draftBack=null; b(); }}});
}
function readDraft(){
  const g=id=>document.getElementById(id);
  if(g("o-title")) draft.title=g("o-title").value;
  if(g("o-date") && g("o-date").value) draft.date=new Date(g("o-date").value).getTime();
  if(g("o-place")) draft.placeName=g("o-place").value;
  if(g("o-notes")) draft.notes=g("o-notes").value;
}
function saveDraft(){
  readDraft();
  if(!draft.title.trim()){ toast("Donne un titre à la sortie"); document.getElementById("o-title")?.focus(); return false; }
  const clean={...draft}; delete clean._new;
  const i=state.user.outings.findIndex(x=>x.id===clean.id);
  if(i>=0) state.user.outings[i]=clean; else state.user.outings.push(clean);
  draft._new=false; saveUser(); renderAgenda(); return true;
}
function outingAction(act,b){
  if(act==="alarm"){ readDraft(); draft.alarm=b.dataset.alarm; renderOutingEditor(); }
  if(act==="unplace"){ readDraft(); draft.placeId=null; draft.placeName=""; renderOutingEditor(); }
  if(act==="pick"){ readDraft(); pickerQuery=""; renderPicker(); }
  if(act==="save"){ if(saveDraft()){ toast("Sortie enregistrée"); draftBack? (draftBack(), draftBack=null) : closeSheet(); } }
  if(act==="ics"){ if(saveDraft()) downloadICS(draft); }
  if(act==="delete"){
    if(b.dataset.confirm){ state.user.outings=state.user.outings.filter(x=>x.id!==draft.id); saveUser(); renderAgenda(); toast("Sortie supprimée"); closeSheet(); }
    else { b.dataset.confirm="1"; b.innerHTML=icon("trash")+"Toucher encore pour confirmer"; }
  }
}
function renderPicker(){
  const q=norm(pickerQuery.trim()); const words=q.split(/\s+/).filter(Boolean);
  const list=(words.length? state.places.filter(p=>words.every(w=>p.search.includes(w))) : state.places).slice(0,80);
  const body=`<label class="search" style="box-shadow:none;margin-bottom:12px">${icon("search")}<input id="pk" type="search" placeholder="Nom du lieu" value="${esc(pickerQuery)}" autocomplete="off"></label>
    <div class="group" id="pklist">${list.map(p=>rowHTML(p)).join("")||`<div class="empty-results">Aucun lieu.</div>`}</div>`;
  openSheet({head:headHTML("Choisir un lieu",true), body, modal:true, full:true, ctx:{type:"picker", back:renderOutingEditor}});
  const pk=$("#pk"); pk.addEventListener("input",()=>{ pickerQuery=pk.value; const q2=norm(pk.value.trim()).split(/\s+/).filter(Boolean);
    const l2=(q2.length? state.places.filter(p=>q2.every(w=>p.search.includes(w))) : state.places).slice(0,80);
    $("#pklist").innerHTML=l2.map(p=>rowHTML(p)).join("")||`<div class="empty-results">Aucun lieu.</div>`; });
  $("#pklist").addEventListener("click",e=>{ const r=e.target.closest("[data-open]"); if(!r) return; e.stopPropagation();
    const p=state.byId.get(r.dataset.open); draft.placeId=p.id; draft.placeName=p.name; if(!draft.title) draft.title=p.name; renderOutingEditor(); });
}
// La ligne « lieu » dans l'éditeur ne doit pas ouvrir la fiche par-dessus
sheet.addEventListener("click",e=>{ if(sheetCtx&&sheetCtx.type==="outing"&&e.target.closest("[data-open]")) e.stopImmediatePropagation(); },true);

function downloadICS(o){
  const p2=n=>String(n).padStart(2,"0");
  const utc=ms=>{ const d=new Date(ms); return d.getUTCFullYear()+p2(d.getUTCMonth()+1)+p2(d.getUTCDate())+"T"+p2(d.getUTCHours())+p2(d.getUTCMinutes())+"00Z"; };
  const escI=s=>String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
  const place=o.placeId&&state.byId.get(o.placeId);
  const loc=place? [place.name, addressOf(place.tags)].filter(Boolean).join(", ") : o.placeName;
  let alarm="";
  if(o.alarm==="2h") alarm="BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:Rappel\r\nTRIGGER:-PT2H\r\nEND:VALARM\r\n";
  if(o.alarm==="eve"){ const d=new Date(o.date); d.setDate(d.getDate()-1); d.setHours(18,0,0,0);
    alarm=`BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:Rappel\r\nTRIGGER;VALUE=DATE-TIME:${utc(d.getTime())}\r\nEND:VALARM\r\n`; }
  const ics="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Sortir a Limoges//FR\r\nBEGIN:VEVENT\r\n"+
    `UID:${o.id}@sortir-limoges\r\nDTSTAMP:${utc(Date.now())}\r\nDTSTART:${utc(o.date)}\r\nDTEND:${utc(o.date+2*3600000)}\r\n`+
    `SUMMARY:${escI(o.title)}\r\n`+(loc?`LOCATION:${escI(loc)}\r\n`:"")+(place?`GEO:${place.lat};${place.lon}\r\n`:"")+(o.notes?`DESCRIPTION:${escI(o.notes)}\r\n`:"")+
    alarm+"END:VEVENT\r\nEND:VCALENDAR\r\n";
  const url=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));
  const a=document.createElement("a"); a.href=url; a.download=(o.title||"sortie").replace(/[^\w\- ]+/g,"").slice(0,40)+".ics";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),10000);
  toast("Ouvre le fichier pour l'ajouter au calendrier");
}

// ---------- Menu ----------
$("#menuBtn").addEventListener("click",()=>{
  const m=$("#menu"); if(!m.hidden){ m.hidden=true; return; }
  m.innerHTML=`
    <button data-m="center">${icon("loc")}Recentrer sur Limoges</button>
    <button data-m="refresh" ${state.loading?"disabled":""}>${icon("refresh")}${state.loading?"Mise à jour en cours…":"Mettre à jour les lieux"}</button>
    <div>${state.lastUpdate?state.places.length+" lieux · mis à jour le "+new Date(state.lastUpdate).toLocaleDateString("fr-FR",{day:"numeric",month:"long"}):"Lieux pas encore chargés"}<br>Données © contributeurs OpenStreetMap</div>`;
  m.hidden=false;
});
$("#menu").addEventListener("click",e=>{
  const b=e.target.closest("[data-m]"); if(!b) return; $("#menu").hidden=true;
  if(b.dataset.m==="center") map.flyTo([45.8336,1.2611],14,{duration:.8});
  if(b.dataset.m==="refresh") loadPlaces(true);
});

// ---------- Onglets ----------
function switchTab(t){
  state.tab=t;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  $("#view-list").hidden=t!=="list"; $("#view-agenda").hidden=t!=="agenda";
  const onMap=t==="map";
  $("#topbar").hidden=!onMap; $("#floatbar").hidden=!onMap;
  if(t==="list") renderList();
  if(t==="agenda") renderAgenda();
  if(onMap) setTimeout(()=>map.invalidateSize(),50);
  renderLoader();
}
document.querySelector(".tabbar").addEventListener("click",e=>{
  const b=e.target.closest("[data-tab]"); if(!b) return;
  if(sheetCtx && sheetCtx.type!=="place") closeSheet();
  if(sheetCtx && sheetCtx.type==="place" && b.dataset.tab!=="map") closeSheet();
  switchTab(b.dataset.tab);
});

// ---------- Chargement ----------
function renderLoader(){
  const el=$("#loader");
  if(state.tab!=="map" || state.places.length){ el.hidden=true; return; }
  if(state.loading){
    el.innerHTML=`<div class="spin"></div><b>Chargement des lieux de Limoges…</b><p>Première ouverture : ça peut prendre jusqu'à une minute. Ensuite, tout est gardé sur ton iPhone.</p>`;
    el.hidden=false;
  } else if(state.error){
    el.innerHTML=`${icon("refresh")}<b>Pas de lieux pour l'instant</b><p>${esc(state.error)}</p><button class="btn" id="retry">Réessayer</button>`;
    el.hidden=false; $("#retry").onclick=()=>loadPlaces(true);
  } else el.hidden=true;
}
function refreshAll(){
  renderMarkers();
  if(state.tab==="list") renderList();
  if(state.tab==="agenda") renderAgenda();
  if(sheetCtx && sheetCtx.type==="place"){ const p=state.byId.get(sheetCtx.id); if(p) renderPlace(p,true); }
}
// Les statuts « ouvert / fermé » bougent avec l'heure
setInterval(()=>{ if(state.places.length){ renderMarkers(); if(state.tab==="list") renderList(); } },60000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && state.places.length) refreshAll(); });

renderChips();
loadPlaces();
</script>
</body>
