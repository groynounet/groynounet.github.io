<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Genèse</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Genèse">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0b16">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#0d0b16;--panel:#171427;--panel2:#221d3a;--line:#2f2952;--txt:#efebff;--mut:#9d96c2;--acc:#b48cff;--gold:#f2c94c;--ok:#5fd39a;--bad:#ff6b6b;--cry:#7fe0ff;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.35 -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{padding:calc(var(--st) + 7px) 12px 7px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg);z-index:5;border-bottom:1px solid #1c1830}
.logo{font-weight:900;letter-spacing:.18em;font-size:17px;background:linear-gradient(90deg,#ffb347,#b48cff,#8fdcff);-webkit-background-clip:text;background-clip:text;color:transparent;flex:none}
.hdr{display:flex;gap:6px;align-items:center;min-width:0}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:5px 10px;font-size:13px;white-space:nowrap}
.cur{display:flex;gap:9px}
.cur .e b{color:#c9a6ff}.cur .g b{color:var(--gold)}.cur .c b{color:var(--cry)}
.hb{border:1px solid var(--line);background:var(--panel2);border-radius:12px;min-width:34px;height:31px;position:relative;font-size:15px;padding:0 6px;flex:none}
.lvb{font-size:12px;font-weight:800;color:var(--gold)}
.hb .dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:#ff5a7a;box-shadow:0 0 8px #ff5a7a}
main{flex:1;position:relative;overflow:hidden;min-height:0}
.screen{position:absolute;inset:0;overflow-y:auto;padding:14px 14px 28px;display:none;-webkit-overflow-scrolling:touch}
.screen.on{display:block}
.wrap{max-width:1180px;margin:0 auto}
#viv{padding:0;overflow:hidden}
#vcan{width:100%;height:100%;display:block;touch-action:none}
#bchips{position:absolute;top:8px;left:0;right:0;display:flex;gap:6px;overflow-x:auto;padding:0 10px;scrollbar-width:none}
#bchips::-webkit-scrollbar{display:none}
#bchips button{flex:none;border:0;border-radius:16px;padding:6px 11px;background:rgba(13,11,22,.62);color:#fff;font-size:12px;font-weight:600;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#bchips button.on{background:var(--acc);color:#16102a}
#bchips button.lock{opacity:.6}
#vday{position:absolute;top:44px;right:10px;background:rgba(13,11,22,.6);border-radius:12px;padding:4px 9px;font-size:12px}
.vhint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(13,11,22,.72);padding:6px 12px;border-radius:14px;font-size:12px;color:#ddd;white-space:nowrap;pointer-events:none;transition:opacity .8s}
nav{display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:var(--sb);z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mut);position:relative}
nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}
nav .dot{position:absolute;top:5px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
h2{font-size:21px;margin:2px 0 12px}
h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin:22px 0 9px}
h4{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin:16px 0 6px}
.mut{color:var(--mut)} .sm{font-size:12.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;font-size:15px;background:var(--acc);color:#140f24}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:10px}
.btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.btn.gold{background:linear-gradient(#f7d774,#dfa531);color:#2a1c00}
.btn.cry{background:linear-gradient(#a8f0ff,#3fb6e0);color:#04202c}
.btn.red{background:#3a1a24;color:#ff9a9a;border:1px solid #5a2533}
.btn:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:10px}
.cc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 5px 8px;text-align:center;position:relative;cursor:pointer}
.cc canvas{width:100%;height:auto;aspect-ratio:1;display:block}
.cc .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc .sp{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc .lv{font-size:11px;opacity:.85}
.cc .tg{position:absolute;top:5px;left:6px;font-size:12px}
.cc .br{position:absolute;top:5px;right:7px;font-size:12px;color:#ff7fb0}
.cc .aw{position:absolute;inset:0;background:rgba(13,11,22,.6);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.cc.sel{outline:2px solid var(--gold)}
.stars{font-size:11px;letter-spacing:1px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:11.5px;padding:3px 8px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:5px}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.elc{font-size:11.5px;padding:3px 8px;border-radius:10px;color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.tabs{display:flex;background:var(--panel2);border-radius:13px;padding:3px;gap:3px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:8px 4px;font-weight:700;font-size:13px;color:var(--mut)}
.tabs button.on{background:var(--acc);color:#140f24}
.sorts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sorts button{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:5px 11px;font-size:12.5px}
.sorts button.on{background:var(--acc);color:#140f24;border-color:var(--acc)}
.gacha{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.gcard.anc{background:linear-gradient(160deg,#2b2048,#171427);border-color:#5b4a2a}
.gcard canvas{width:96px;height:96px}
.gcard small{color:var(--mut);font-size:11px;line-height:1.3}
.gcard .btn{width:100%}
.incub{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.slot{background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:10px;text-align:center;min-height:172px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.slot.full{border-style:solid}
.slot canvas{width:90px;height:90px}
.slot .t{font-variant-numeric:tabular-nums;font-weight:700}
.slot small{color:var(--mut);font-size:11px}
.shg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sh{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.sh canvas{width:72px;height:72px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.sw{width:46px;height:28px;border-radius:14px;background:#3a3456;position:relative;border:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--ok)} .sw.on::after{left:21px}
#sheetBg,#modalBg{position:fixed;inset:0;background:rgba(5,3,12,.62);z-index:20;display:flex;align-items:flex-end}
#modalBg{align-items:center;justify-content:center;z-index:30;padding:16px}
#sheet{width:100%;max-height:90%;overflow-y:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:14px 16px calc(18px + var(--sb));border-top:1px solid var(--line);animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#modal{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;animation:pop .22s}
#modal.wide{max-width:720px}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.sh-top{display:flex;gap:12px;align-items:flex-start}
.sh-port canvas{width:124px;height:124px;background:radial-gradient(circle at 50% 70%,#2c2650,#171427 70%);border-radius:16px}
.sh-id{flex:1;min-width:0}
.sh-id input{background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--txt);font-weight:800;font-size:20px;width:100%;padding:2px 0;outline:none}
.row{display:flex;gap:6px;align-items:center}
.mini{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:3px 9px;font-size:14px}
.x{border:0;background:var(--panel2);border-radius:50%;width:32px;height:32px;font-size:15px;flex:none}
.spn{font-weight:700;margin-top:4px}
.bar{height:7px;background:#0b0914;border-radius:4px;overflow:hidden;margin:6px 0 4px}
.bar b{display:block;height:100%;background:linear-gradient(90deg,#8f6bff,#c9a6ff)}
.sb{display:grid;grid-template-columns:72px 1fr 52px;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.sb i{height:7px;background:#0b0914;border-radius:4px;overflow:hidden;display:block}
.sb i b{display:block;height:100%;border-radius:4px}
.sb em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.sb em small{color:var(--ok);font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.acts .btn{flex:1 1 45%}
.skilltxt{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px;margin-top:6px}
.eqg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.eqs{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 3px;text-align:center;font-size:10.5px;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.eqs .ic{font-size:22px}
.eqs.empty{border-style:dashed;color:var(--mut)}
.it{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;position:relative;cursor:pointer}
.it .ic{font-size:30px;line-height:1.1}
.it .nm{font-weight:700;font-size:12.5px}
.it .lv{position:absolute;top:5px;right:7px;font-size:11px;font-weight:800;color:var(--gold)}
.it .on{font-size:10.5px;color:var(--mut)}
.team{display:flex;flex-direction:column;gap:10px}
.tslots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ts{background:var(--panel2);border-radius:12px;text-align:center;padding:4px 4px 6px;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;cursor:pointer}
.ts canvas{width:80px;height:80px}
.ts.empty{color:var(--mut);border:1px dashed var(--line);background:none;font-size:24px}
.bt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.bt .num{width:32px;height:32px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.bt.boss .num{background:#4a1d2b;color:#ffb3b3}
.bt .bi{flex:1;min-width:0}
.bt .bi b{display:block;font-size:14.5px}
.bt .bi small{color:var(--mut);font-size:12px}
.bt .st{font-size:16px;flex:none}
.bt.done .st{color:var(--ok)}
.bt.open{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.bt.lock{opacity:.45}
.edots{display:flex;gap:3px;margin-top:3px}
.edots i{width:10px;height:10px;border-radius:50%;display:block;border:1px solid rgba(255,255,255,.25)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:7px}
.bx{background:var(--panel);border:1px solid var(--line);border-radius:12px;text-align:center;padding:2px 2px 5px;font-size:10.5px;min-height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.bx canvas{width:62px;height:62px}
.bx.unk{color:#4a4470;font-size:24px;font-weight:800;background:#120f20;cursor:default}
.prog{height:10px;background:#0b0914;border-radius:5px;overflow:hidden;margin:8px 0 2px}
.prog b{display:block;height:100%;background:linear-gradient(90deg,#ffb347,#b48cff,#8fdcff)}
.dgrid{display:grid;gap:12px}
.plots{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;margin-top:10px}
.plot{background:linear-gradient(#2c2117,#221910);border:1px solid #4a3626;border-radius:12px;text-align:center;padding:4px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;cursor:pointer}
.plot canvas{width:86px;height:66px}
.plot .t{font-weight:700;font-variant-numeric:tabular-nums}
.mrow{display:flex;gap:12px;align-items:center;margin:8px 0}
.mrow canvas{width:150px;height:96px;flex:none;border-radius:12px;background:#120e18}
.big{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.wk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.wslot{background:var(--panel2);border:1px dashed var(--line);border-radius:12px;padding:6px;display:flex;align-items:center;gap:8px;font-size:12px;min-height:56px;cursor:pointer}
.wslot canvas{width:46px;height:46px}
.wslot.full{border-style:solid}
.lockc{opacity:.55}
.exp{background:var(--panel2);border-radius:12px;padding:9px 10px;margin-top:8px;display:flex;align-items:center;gap:10px;font-size:13px}
.exp .f{flex:1;min-width:0}
.calg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cd{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:5px 2px;text-align:center;font-size:10px;min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;line-height:1.15}
.cd .ic{font-size:18px}
.cd .dn{position:absolute;top:2px;left:5px;font-size:9px;color:var(--mut)}
.cd.got{opacity:.42}
.cd.got::after{content:'✓';position:absolute;top:2px;right:5px;color:var(--ok);font-weight:900}
.cd.now{border-color:var(--gold);box-shadow:0 0 12px rgba(242,201,76,.55)}
.cd.big{background:linear-gradient(160deg,#4a1d4a,#221d3a);border-color:#ff7ad9}
.calhead{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.calhead canvas{width:110px;height:110px;flex:none}
.q{background:var(--panel2);border-radius:12px;padding:10px;margin-top:8px;display:flex;gap:10px;align-items:center;font-size:13px}
.q .f{flex:1}
.q.done{opacity:.5}
.ul{list-style:none;padding:0;margin:8px 0}
.ul li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
#battle{position:fixed;inset:0;z-index:15;background:#05040a}
.bw{height:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column;background:#000}
.btop{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:calc(var(--st) + 6px) 10px 6px;background:var(--bg)}
#bTitle{font-weight:800;font-size:14.5px;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bb{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:5px 10px;font-weight:800;font-size:13px}
.bb.on{background:var(--acc);color:#140f24}
.bb.lk{opacity:.45}
#bcan{flex:1;width:100%;display:block;min-height:0;touch-action:none}
#bSkills{display:flex;gap:8px;padding:8px 10px calc(10px + var(--sb));background:var(--bg)}
.skill{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:7px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px}
.skill .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.skill .sk{font-size:11px;color:var(--mut)}
.skill .bar{width:100%;height:6px;margin:2px 0 0}
.skill .bar b{background:var(--gold);width:0}
.skill.ready{border-color:var(--gold);animation:glow .9s infinite alternate}
.skill.ready .sk{color:var(--gold);font-weight:800}
.skill.dead{opacity:.35}
@keyframes glow{from{box-shadow:0 0 4px rgba(242,201,76,.3)}to{box-shadow:0 0 16px rgba(242,201,76,.8)}}
#toasts{position:fixed;top:calc(var(--st) + 52px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:40;pointer-events:none}
.toast{background:rgba(34,29,58,.97);border:1px solid var(--line);padding:8px 14px;border-radius:14px;font-size:13px;max-width:min(92%,520px);box-shadow:0 6px 20px rgba(0,0,0,.45);animation:tin .3s;transition:opacity .4s,transform .4s;text-align:center}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
.reveal{text-align:center}
.reveal canvas{width:240px;height:240px;display:block;margin:0 auto}
.reveal .new{display:inline-block;background:linear-gradient(90deg,#ffb347,#ff6fa8);color:#2a0a14;font-weight:800;font-size:12px;padding:4px 10px;border-radius:10px;margin:6px 0}
.win{color:var(--gold);text-align:center;font-size:26px}
.lose{color:var(--bad);text-align:center;font-size:26px}
.rew{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.rew div{background:var(--panel2);border-radius:10px;padding:7px 10px;font-size:13.5px}
ul.intro{padding-left:18px;margin:8px 0 14px}
ul.intro li{margin:7px 0}
@media (max-width:400px){.logo{font-size:14px;letter-spacing:.1em}.cur{gap:6px}.pill{padding:5px 8px;font-size:12px}.hb{min-width:30px;padding:0 4px}}
@media (min-width:860px){
  #app{display:grid;grid-template-columns:96px 1fr;grid-template-rows:auto 1fr}
  header{grid-column:1/3;grid-row:1;padding:12px 22px}
  .logo{font-size:20px}
  nav{grid-column:1;grid-row:2;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding:12px 0;gap:4px}
  nav button{flex:none;padding:13px 0;font-size:12px}
  nav button svg{width:26px;height:26px}
  main{grid-column:2;grid-row:2}
  .screen{padding:24px 32px 40px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(138px,1fr))}
  .gacha{grid-template-columns:repeat(4,1fr)}
  .dgrid{grid-template-columns:1fr 1fr}
  .bgrid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
  .bx canvas{width:74px;height:74px}
  #sheetBg{justify-content:flex-end;align-items:stretch}
  #sheet{width:480px;max-height:none;height:100%;border-radius:0;border-top:0;border-left:1px solid var(--line);animation:side .25s;padding:20px}
  @keyframes side{from{transform:translateX(40px);opacity:0}}
  #toasts{top:70px}
  .calg{grid-template-columns:repeat(10,1fr)}
}
</style>
</head>
<body>
<div id="app">
  <header><div class="logo">GENÈSE</div><div class="hdr">
    <button class="pill cur" id="hCur"><span class="e">◆<b id="ess">0</b></span><span class="g">●<b id="gold">0</b></span><span class="c">♦<b id="cry">0</b></span></button>

const pick=a=>a[Math.floor(R()*a.length)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hex2rgb(h){const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]}
function rgb2hex(r,g,b){return'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('')}
function hexA(h,a){const c=hex2rgb(h);return`rgba(${c[0]},${c[1]},${c[2]},${a})`}
function mix(h1,h2,t){const a=hex2rgb(h1),b=hex2rgb(h2);return rgb2hex(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t)}
function shade(h,amt){return amt>0?mix(h,'#ffffff',amt):mix(h,'#000000',-amt)}
function hue(h,deg){
  let[r,g,b]=hex2rgb(h).map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let Hh=0,Ss=0;const L=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;Ss=L>.5?d/(2-mx-mn):d/(mx+mn);Hh=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;Hh/=6}
  if(Ss===0)return h;Hh=((Hh+deg/360)%1+1)%1;
  const f=(p,q,t)=>{t=(t%1+1)%1;return t<1/6?p+(q-p)*6*t:t<1/2?q:t<2/3?p+(q-p)*(2/3-t)*6:p};
  const q=L<.5?L*(1+Ss):L+Ss-L*Ss,p=2*L-q;return rgb2hex(f(p,q,Hh+1/3)*255,f(p,q,Hh)*255,f(p,q,Hh-1/3)*255)}
function addEll(p,cx,cy,rx,ry,rot){p.moveTo(cx+rx*Math.cos(rot),cy+rx*Math.sin(rot));p.ellipse(cx,cy,rx,ry,rot,0,TAU)}
function fmtT(ms){const s=Math.max(0,Math.ceil(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h} h ${String(m).padStart(2,'0')}`:m+':'+String(x).padStart(2,'0')}
function dayStr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}

/* ================= Génétique ================= */
function spKey(g){const a=Math.min(g.el[0],g.el[1]),b=Math.max(g.el[0],g.el[1]);return a+'-'+b+'-'+g.m}
function spName(g){const a=Math.min(g.el[0],g.el[1]),b=Math.max(g.el[0],g.el[1]);const s=MORPH[g.m].suf;return a===b?EL[a].pre+s:EL[a].pre+'o'+EL[b].sec+s}
function statTotal(g){const s=g.stats;return s.hp+s.atk+s.def+s.spd}
function rarity(g){const t=statTotal(g);return t>=39?4:t>=33?3:t>=27?2:t>=20?1:0}
function genStats(rar,rng){const rg=[[12,19],[20,26],[27,32],[33,38],[39,40]][rar];const tot=rg[0]+Math.floor(rng()*(rg[1]-rg[0]+1));const s=[1,1,1,1];let rem=tot-4;while(rem>0){const i=Math.floor(rng()*4);if(s[i]<10){s[i]++;rem--}}return{hp:s[0],atk:s[1],def:s[2],spd:s[3]}}
function newGenome(rar,e1,e2,rng){rng=rng||R;
  return{el:[e1,e2],m:Math.floor(rng()*5),horns:rng()<.45?1+Math.floor(rng()*3):0,tail:Math.floor(rng()*4),wings:rng()<.28?1:0,
    eyes:rng()<.12?1:rng()<.86?2:3,pat:Math.floor(rng()*3),hue:Math.round(rng()*36-18),size:Math.round((.88+rng()*.24)*100)/100,
    stats:genStats(rar,rng),temp:Math.floor(rng()*6)}}
function breed(a,b){
  const P=()=>R()<.5?a:b, mut=p=>R()<p;
  let e1=a.el[R()<.5?0:1], e2=b.el[R()<.5?0:1];
  if(R()<.5){const t=e1;e1=e2;e2=t}
  if(mut(.08))e2=Math.floor(R()*6);
  const st={};['hp','atk','def','spd'].forEach(k=>{let v=Math.round((a.stats[k]+b.stats[k])/2+(R()*3-1));if(mut(.1))v+=2;st[k]=clamp(v,1,10)});
  return{el:[e1,e2],m:mut(.08)?Math.floor(R()*5):P().m,horns:mut(.12)?Math.floor(R()*4):P().horns,tail:mut(.12)?Math.floor(R()*4):P().tail,
    wings:mut(.12)?(R()<.5?1:0):P().wings,eyes:mut(.1)?1+Math.floor(R()*3):P().eyes,pat:mut(.12)?Math.floor(R()*3):P().pat,
    hue:clamp(Math.round((a.hue+b.hue)/2+R()*12-6),-24,24),size:Math.round(clamp((a.size+b.size)/2+R()*.08-.04,.82,1.2)*100)/100,
    stats:st,temp:mut(.15)?Math.floor(R()*6):P().temp}}
const xpNeed=l=>18+l*12;
const stageFor=l=>l>=14?2:l>=6?1:0;
const itemById=id=>id==null?null:S.items.find(i=>i.id===id);
function itemStats(it){const p=EQ[it.s].p,m=RMUL[it.rar]*it.roll*(1+.22*(it.lvl-1)),o={};for(const k in p)o[k]=Math.max(1,Math.round(p[k]*m));return o}
const itemName=it=>EQ[it.s].names[it.rar];
const itemLabel=it=>`<span style="color:${RAR[it.rar].c};font-weight:700">${EQ[it.s].ic} ${itemName(it)}</span>`;
const statTxt=o=>Object.entries(o).map(([k,v])=>`+${v} ${STATN[k]}`).join(' · ');
function gear(c){const o={hp:0,atk:0,def:0,spd:0};if(c.eq)for(const id of c.eq){const it=itemById(id);if(it){const s=itemStats(it);for(const k in s)o[k]+=s[k]}}return o}
function stats(c){const s=c.g.stats,L=c.lvl,m=[1,1.12,1.28][c.stage],q=gear(c);
  return{hp:Math.round((40+s.hp*9+L*7)*m)+q.hp,atk:Math.round((6+s.atk*2.2+L*1.8)*m)+q.atk,def:Math.round((3+s.def*1.6+L*1.1)*m)+q.def,spd:Math.round(8+s.spd*1.5+L*.4)+q.spd}}
function effMult(a,d){const m=x=>BEATS[a].includes(x)?1.5:(a<4&&x<4&&BEATS[x].includes(a))?.7:1;return(m(d[0])+m(d[1]))/2}

/* ================= État & sauvegarde ================= */
let S;
const DEF=()=>({v:2,ess:200,gold:300,cry:20,nextId:1,nextItem:1,crea:[],eggs:[],best:{},prog:0,team:[],pity:0,aff:{},speed:1,free:true,intro:false,lastSeen:Date.now(),sort:'rar',ctab:'list',
  acc:{lvl:1,xp:0},items:[],shards:{},food:[0,0,0,0,0,0],farm:{lvl:1,plots:[]},mine:{lvl:1,stock:0,last:Date.now(),w:[]},cmine:{lvl:1,stock:0,last:Date.now(),w:[]},
  exps:[],cal:{m:'',n:0,last:''},q:null,ach:{},st:{},auto:false,xslot:0});
function makeCreature(g,o){o=o||{};const lvl=o.lvl||1;
  return{id:S.nextId++,name:o.name||nick(),g,lvl,xp:0,stage:stageFor(lvl),gen:o.gen||1,parents:o.parents||null,born:Date.now(),hunger:80,energy:85,social:60,exp:[0,0,0,0,0,0],cd:0,eq:[null,null,null,null],away:0}}
function newGame(){S=DEF();
  const els=[0,1,2,3].sort(()=>R()-.5).slice(0,3);
  els.forEach((e,i)=>{const c=makeCreature(newGenome(i===0?1:0,e,e),{lvl:2});S.crea.push(c);S.team.push(c.id);discover(c.g,true)});
  S.farm.plots=[null,null,null];S.food[2]=2;S.food[3]=2}
function load(){try{const t=localStorage.getItem(KEY);if(!t)return false;const d=JSON.parse(t);if(!d||!Array.isArray(d.crea))return false;
  const def=DEF();S=Object.assign(def,d);if(!d.v||d.v<2){S.intro=false;S.v=2;S.gold=Math.max(S.gold,300)}
  for(const k of['acc','farm','mine','cmine','cal','st'])S[k]=Object.assign(DEF()[k],d[k]||{});
  if(!Array.isArray(S.food)||S.food.length!==6)S.food=[0,0,0,0,0,0];
  S.crea.forEach(c=>{c.stage=stageFor(c.lvl);c.exp=c.exp||[0,0,0,0,0,0];c.eq=c.eq||[null,null,null,null];c.away=c.away||0});
  while(S.farm.plots.length<plotsN())S.farm.plots.push(null);
  return true}catch(e){return false}}
function save(){try{S.lastSeen=Date.now();
  for(const c of S.crea){if(c._x!=null&&V.BW){c.fx=c._x/V.BW;c.fy=(c._y-V.gt)/Math.max(1,V.gb-V.gt)}}
  localStorage.setItem(KEY,JSON.stringify(S,(k,v)=>k[0]==='_'?undefined:v))}catch(e){}}
const byId=id=>S.crea.find(c=>c.id===id);
const isAway=c=>c.away>Date.now();
const slotsN=()=>4+(has('slot')?1:0)+(S.xslot?1:0);
const plotsN=()=>2+S.farm.lvl;
function discover(g,silent){const k=spKey(g);if(S.best[k])return false;
  S.best[k]={t:Date.now(),g:clean(g)};

function renderChips(){$('#bchips').innerHTML=BIOMES.map((b,i)=>`<button data-b="${i}" class="${b.unlock>S.prog?'lock':''}">${b.unlock>S.prog?'🔒 ':''}${b.s}</button>`).join('');V.chip=-1}

  hideHint();if(best){openCreature(best);return}
  for(const h of V.hot)if(sx>=h.x&&sx<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){show(h.go);return}

function itemCard(it,note){const d=document.createElement('div');d.className='it';d.style.borderColor=hexA(RAR[it.rar].c,.55);

function pickMate(c){const now=Date.now();

  openModal(`${head2('Accoupler '+esc(c.name))}<p class="mut sm">Coût : ◆ 40. L'œuf rejoint la couveuse et éclot en 1 minute. Le petit hérite d'un mélange des gènes des deux parents, avec une chance de mutation.</p><div class="grid" id="mGrid"></div>`);
  const gr=$('#mGrid');
  list.sort((a,b)=>getAff(c,b)-getAff(c,a)).forEach(p=>{const a=getAff(c,p);const card=creatureCard(p,`<div class="sp" style="color:${a>=45?'#ff8fbf':a<0?'#ff8a8a':'#9d96c2'}">${a>=45?'♥ Grande affinité':a<0?'Se disputent':'Affinité moyenne'}</div>`);card.onclick=()=>doBreed(c,p);gr.appendChild(card)})}
function doBreed(a,b){if(S.ess<40){toast('Il te faut 40 ◆');return}if(S.eggs.length>=slotsN()){toast('Couveuse pleine : fais d\'abord éclore un œuf');return}if(popFull()){toast(`Vivarium plein (${CAP} créatures et œufs maximum)`);return}

function layEgg(a,b,manual){const g=breed(a.g,b.g);S.eggs.push({g,kind:'nid',ready:Date.now()+(manual?60000:120000),gen:Math.max(a.gen,b.gen)+1,parents:[a.name,b.name]});
  a.cd=b.cd=Date.now()+8*60000;changeAff(a,b,5);toast(`🥚 ${esc(a.name)} et ${esc(b.name)} ont pondu un œuf !`);track('breed');save();updRes();if(cur==='eggs')renderEggs()}

function tickEggs(){if(cur!=='eggs')return;const now=Date.now();const sig=S.eggs.map(e=>e.ready<=now?1:0).join('');if(sig!==eggSig){renderEggs();return}
  document.querySelectorAll('[data-t]').forEach(s=>{const e=S.eggs[+s.dataset.t];if(e)s.textContent=fmtT(e.ready-now)})}
function pull(kind){const cry=kind==='ancc';const cost=cry?40:kind==='anc'?300:100;
  if(cry?S.cry<cost:S.ess<cost){toast(cry?'Il te faut 40 ♦':`Il te faut ${cost} ◆ — gagne-en en combattant`);return}if(S.eggs.length>=slotsN()){toast('Couveuse pleine : fais d\'abord éclore un œuf');return}
  if(popFull()){toast(`Vivarium plein (${CAP} maximum) : libère une créature`);return}
  if(cry)S.cry-=cost;else S.ess-=cost;if(cry)kind='anc';
  const w=kind==='anc'?[0,60,32,8]:[70,24,5,1];let x=R()*100,rar=0;for(let i=0;i<4;i++){if(x<w[i]){rar=i;break}x-=w[i]}
  S.pity++;if(S.pity>=40)rar=3;if(rar===3)S.pity=0;
  const e1=Math.floor(R()*6);const e2=rar===3&&R()<.5?Math.floor(R()*6):e1;
  S.eggs.push({g:newGenome(rar,e1,e2),kind,ready:Date.now()+(kind==='anc'?90000:45000),gen:1,parents:null});
  track('pull');updRes();save();renderEggs();toast('🥚 Œuf placé en couveuse')}
function hatch(i){const e=S.eggs[i];if(!e||e.ready>Date.now())return;if(S.crea.length>=CAP){toast(`Vivarium plein (${CAP} maximum) : libère une créature`);return}
  S.eggs.splice(i,1);const c=makeCreature(e.g,{gen:e.gen,parents:e.parents});S.crea.push(c);if(V.BW)placeCreature(c);
  const isNew=discover(c.g,true);if(isNew)S.ess+=20;track('hatch');accXP(15);updRes();save();renderEggs();reveal(c,isNew,e)}
function fuse(k){const s=S.shards[k];if(!s||s.n<NEED[s.rar])return;if(S.crea.length>=CAP){toast(`Vivarium plein (${CAP} maximum)`);return}
  s.n-=NEED[s.rar];const g=clean(s.g);g.stats=genStats(s.rar,R);const rar=s.rar;if(s.n<=0)delete S.shards[k];
  const c=makeCreature(g);S.crea.push(c);if(V.BW)placeCreature(c);const isNew=discover(c.g,true);if(isNew)S.ess+=20;accXP(25);updRes();save();renderEggs();reveal(c,isNew,{kind:'shard',rar})}
function reveal(c,isNew,e){const g=c.g,rar=rarity(g),cols=eggCols(e);

    const sc=Math.min(1,(k-1.3)/.4);const sf=g.size*(1+c.stage*.2),s=1.8/sf*(.6+.4*sc);drawCreature(ctx,g,c.stage,120+morphOff(g.m)*13*s*sf,190,s,t,{f:1,walk:true});
    if(k>1.5){const tx=$('#rvTxt');if(tx&&tx.style.opacity!=='1')tx.style.opacity=1}});

/* --- Domaine --- */
function mineRate(m,kind){const base=kind==='g'?30*m.lvl:1.5*m.lvl;let b=1;for(const id of m.w){const c=byId(id);if(!c||isAway(c))continue;const e=c.g.el;b+=kind==='g'?(e.includes(2)?.5:e.includes(0)?.35:.2):((e.includes(5)||e.includes(4))?.5:.2)}return base*b}
const mineCap=(m,kind)=>mineRate(m,kind)*(kind==='g'?6:12);
function updMine(m,kind){const now=Date.now();const cap=mineCap(m,kind);m.stock=Math.min(cap,m.stock+mineRate(m,kind)*(now-m.last)/3.6e6);m.last=now;return cap?m.stock/cap:0}
const mineUp=(m,kind)=>kind==='g'?{gold:Math.round(400*Math.pow(m.lvl,1.5))}:{gold:Math.round(1500*m.lvl),cry:10*m.lvl};
const farmCost=()=>Math.round(250*Math.pow(S.farm.lvl,1.5));
let domSig='';
function renderDom(){const el=$('#dom'),now=Date.now();anims.dom=[];
  while(S.farm.plots.length<plotsN())S.farm.plots.push(null);
  const mineCard=(m,kind,key,title,ic,cu)=>{if(!has(key))return`<div class="card lockc"><b>${ic} ${title}</b><p class="mut sm">🔒 Se débloque au niveau de compte ${unlLvl(key)}.</p></div>`;
    updMine(m,kind);const cap=mineCap(m,kind),up=mineUp(m,kind);

     <div class="mrow"><div data-mcv="${kind}"></div><div><div class="big">${cu} <span data-ms="${kind}">${fmtN(m.stock)}</span><span class="mut sm"> / ${fmtN(cap)}</span></div><div class="mut sm">+${kind==='g'?fmtN(mineRate(m,kind)):mineRate(m,kind).toFixed(1)} / h · se remplit en ${kind==='g'?6:12} h</div><button class="btn ${kind==='g'?'gold':'cry'} sm" style="margin-top:6px" data-mcol="${kind}">Collecter</button></div></div>

  el.querySelectorAll('[data-w]').forEach(h=>{const[kind,i]=h.dataset.w.split(':'),m=kind==='g'?S.mine:S.cmine,c=byId(m.w[+i]);
    if(c){h.appendChild(cPortrait(c,46));h.insertAdjacentHTML('beforeend',`<div><b>${esc(c.name)}</b><div class="mut">${isAway(c)?'en expédition':EL[c.g.el[0]].name+' · toucher pour retirer'}</div></div>`);h.onclick=()=>{updMine(m,kind);m.w.splice(+i,1);save();renderDom()}}

  const xl=$('#expL');if(xl){S.exps.forEach((x,i)=>{const z=ZONES[x.z],d=document.createElement('div');d.className='exp';const done=x.end<=now;
      d.innerHTML=`<div class="f"><b>${z.n}</b><div class="mut sm">${x.ids.map(id=>byId(id)).filter(Boolean).map(c=>esc(c.name)).join(', ')} · ${DUR[x.d].n}</div></div>`+(done?`<button class="btn sm">Récupérer</button>`:`<span class="t" data-xt="${i}" style="font-weight:700">${fmtT(x.end-now)}</span><button class="btn cry sm" data-xr="${i}">⚡ ♦ ${Math.max(3,Math.ceil((x.end-now)/600000))}</button>`);
      if(done)d.querySelector('button').onclick=()=>claimExp(i);xl.appendChild(d)});

    xl.querySelectorAll('[data-xr]').forEach(b=>b.onclick=()=>{const x=S.exps[+b.dataset.xr];const c=Math.max(3,Math.ceil((x.end-Date.now())/600000));if(S.cry<c){toast(`Il te faut ${c} ♦`);return}S.cry-=c;x.end=Date.now()-1;updRes();save();renderDom()})}
  domSig=domSigNow()}
const domSigNow=()=>{const now=Date.now();return S.farm.plots.map(p=>p?(p.end<=now?2:1):0).join('')+'|'+S.exps.map(x=>x.end<=now?1:0).join('')};
function tickDom(){if(cur!=='dom')return;if(domSigNow()!==domSig){renderDom();return}const now=Date.now();
  document.querySelectorAll('[data-pt]').forEach(s=>{const p=S.farm.plots[+s.dataset.pt];if(p)s.textContent=fmtT(p.end-now)});
  document.querySelectorAll('[data-xt]').forEach(s=>{const x=S.exps[+s.dataset.xt];if(x)s.textContent=fmtT(x.end-now)});
  document.querySelectorAll('[data-ms]').forEach(s=>{const kind=s.dataset.ms,m=kind==='g'?S.mine:S.cmine;updMine(m,kind);s.textContent=fmtN(m.stock)})}
const seedOk=sd=>BIOMES.some(b=>b.unlock<=S.prog&&b.el.includes(sd.el));
function plantModal(i){openModal(`${head2('Planter')}<p class="mut sm">Chaque graine donne ${3+Math.floor(S.farm.lvl/2)} à ${4+Math.floor(S.farm.lvl/2)} fruits de son élément.</p><div id="seedL"></div>`);
  const L=$('#seedL');SEEDS.forEach((sd,si)=>{const ok=seedOk(sd),d=document.createElement('div');d.className='q';
    d.innerHTML=`<span style="width:14px;height:14px;border-radius:50%;background:${EL[sd.el].c};flex:none"></span><div class="f"><b>${sd.n}</b><div class="mut sm">${EL[sd.el].name} · pousse en ${sd.t>=60?(sd.t/60)+' h':sd.t+' min'}${ok?'':' · 🔒 biome à débloquer'}</div></div><button class="btn gold sm" ${ok?'':'disabled'}>● ${sd.cost}</button>`;
    d.querySelector('button').onclick=()=>{if(S.gold<sd.cost){toast('Pas assez d\'or');return}S.gold-=sd.cost;const now=Date.now();S.farm.plots[i]={s:si,t0:now,end:now+sd.t*60000};updRes();save();closeModal();renderDom()};L.appendChild(d)})}
function harvest(i){const p=S.farm.plots[i];if(!p||p.end>Date.now())return;const el=SEEDS[p.s].el,n=3+Math.floor(S.farm.lvl/2)+(R()<.35?1:0);S.food[el]+=n;S.farm.plots[i]=null;track('harvest');accXP(5);save();renderDom();toast(`🧺 +${n} fruits ${EL[el].name}`)}
function collectMine(kind){const m=kind==='g'?S.mine:S.cmine;updMine(m,kind);const n=Math.floor(m.stock);if(n<1){toast('Rien à collecter pour l\'instant');return}m.stock-=n;
  if(kind==='g'){S.gold+=n;S.st.goldmine=(S.st.goldmine||0)+n;track('mine')}else S.cry+=n;accXP(3);updRes();save();renderDom();toast(`${kind==='g'?'●':'♦'} +${fmtN(n)} ${kind==='g'?'or':'cristaux'}`)}
function workerModal(kind){const m=kind==='g'?S.mine:S.cmine,other=kind==='g'?S.cmine:S.mine;const list=S.crea.filter(c=>!m.w.includes(c.id)&&!isAway(c));
  openModal(`${head2('Choisir un mineur')}<div class="grid" id="wkL"></div>`);const gr=$('#wkL');
  list.forEach(c=>{const card=creatureCard(c);card.onclick=()=>{updMine(m,kind);updMine(other,kind==='g'?'c':'g');other.w=other.w.filter(id=>id!==c.id);if(m.w.length<2)m.w.push(c.id);save();closeModal();renderDom()};gr.appendChild(card)})}
function expPower(ids){return ids.map(byId).filter(Boolean).reduce((s,c)=>s+c.lvl*(1+rarity(c.g)*.25),0)}
function expModal(){let z=0,dI=1,sel=[];const zones=ZONES.filter(zz=>BIOMES[zz.b].unlock<=S.prog);
  const draw=()=>{const zn=ZONES[z],pw=expPower(sel),succ=clamp(pw/zn.req,.4,1.25);
    openModal(`${head2('Nouvelle expédition')}<h4 style="margin-top:4px">Zone</h4><div class="sorts">${zones.map(zz=>`<button data-z="${ZONES.indexOf(zz)}" class="${ZONES.indexOf(zz)===z?'on':''}">${zz.n}</button>`).join('')}</div>
     <div class="mut sm">Puissance conseillée : ${zn.req} · butin : ${[zn.rw.gold&&'or',zn.rw.food&&'fruits',zn.rw.sh&&'éclats',zn.rw.item&&'équipement',zn.rw.ess&&'essence',zn.rw.cry&&'cristaux'].filter(Boolean).join(', ')}</div>
     <h4>Durée</h4><div class="sorts">${DUR.map((d,i)=>`<button data-d="${i}" class="${i===dI?'on':''}">${d.n}</button>`).join('')}</div>
     <h4>Équipe (3 max) · puissance ${Math.round(pw)} · réussite ${Math.round(succ/1.25*100)} %</h4><div class="grid" id="exG"></div>
     <div class="acts"><button class="btn" id="exGo" ${sel.length?'':'disabled'}>Partir</button></div>`,true);
    $('#modal').querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{z=+b.dataset.z;draw()});
    $('#modal').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{dI=+b.dataset.d;draw()});
    const gr=$('#exG');S.crea.filter(c=>!isAway(c)).sort((a,b)=>b.lvl-a.lvl).forEach(c=>{const card=creatureCard(c);card.classList.toggle('sel',sel.includes(c.id));
      card.onclick=()=>{if(sel.includes(c.id))sel=sel.filter(i=>i!==c.id);else if(sel.length<3)sel.push(c.id);draw()};gr.appendChild(card)});
    $('#exGo').onclick=()=>{if(!sel.length)return;const now=Date.now(),end=now+DUR[dI].m*60000;S.exps.push({z,d:dI,ids:[...sel],start:now,end});
      sel.forEach(id=>{const c=byId(id);c.away=end;S.team=S.team.filter(t=>t!==id)});save();closeModal();renderDom();toast('🧭 Expédition lancée')}};
  draw()}
function claimExp(i){const x=S.exps[i];if(!x||x.end>Date.now())return;const zn=ZONES[x.z],mul=DUR[x.d].x,succ=clamp(expPower(x.ids)/zn.req,.4,1.25),rw=zn.rw,out=[];
  if(rw.gold)out.push(...give({gold:Math.round(rw.gold*mul*succ)}));
  if(rw.ess)out.push(...give({ess:Math.round(rw.ess*mul*succ)}));
  if(rw.cry)out.push(...give({cry:Math.max(1,Math.round(rw.cry*mul*succ))}));
  if(rw.food)out.push(...give({food:Math.max(1,Math.round(rw.food*Math.sqrt(mul)*succ))}));
  if(rw.sh){const els=BIOMES[zn.b].el;const g=newGenome(0,pick(els),pick(els));const rar=clamp(Math.floor(R()*(1+zn.b/2)),0,2);out.push(...give({shard:{g,rar,n:Math.max(2,Math.round(rw.sh*3*Math.sqrt(mul)*succ))}}))}
  if(rw.item&&R()<Math.min(.95,rw.item*Math.sqrt(mul)*succ)){const rar=clamp(Math.floor(zn.b/2)+(R()<.25?1:0),0,3);out.push(...give({item:rar}))}
  const ev=[];x.ids.forEach(id=>{const c=byId(id);if(c){c.away=0;if(c._x==null&&V.BW)placeCreature(c);ev.push(...addXP(c,10*mul,true))}});
  S.exps.splice(i,1);track('exped');accXP(20);save();renderDom();
  openModal(`<h2 class="win">Expédition terminée</h2><p class="mut sm" style="text-align:center">${zn.n} · réussite ${Math.round(succ/1.25*100)} %</p><div class="rew">${out.map(o=>`<div>${o}</div>`).join('')}<div>✦ +${10*mul} XP pour chaque explorateur</div>${ev.map(m=>`<div>${m}</div>`).join('')}</div><button class="btn" style="width:100%" onclick="closeModal()">Super !</button>`)}

/* --- Calendrier, quêtes, profil --- */
function calSync(){const m=monthStr();if(S.cal.m!==m){S.cal={m,n:0,last:''}}}
function calFeat(){const m=monthStr();let h=7;for(const ch of m)h=(h*31+ch.charCodeAt(0))|0;const rng=mulberry(h);
  const le=[Math.floor(rng()*6),Math.floor(rng()*6)],leg=newGenome(3,le[0],le[1],rng);const me=Math.floor(rng()*6),myth=newGenome(4,me,(me+1+Math.floor(rng()*5))%6,rng);myth.horns=3;
  const ee=Math.floor(rng()*6),ep=newGenome(2,ee,ee,rng);const ce=Math.floor(rng()*4),com=newGenome(0,ce,ce,rng);return{leg,myth,ep,com}}
function calReward(i){const r=CAL[i],f=calFeat();
  if(r.sh){const g=r.sh==='leg'?f.leg:r.sh==='ep'?f.ep:f.com,rar=r.sh==='leg'?3:r.sh==='ep'?2:0;return{shard:{g,rar,n:r.n}}}
  if(r.myth)return{crea:f.myth};if(r.item)return{item:r.item};return Object.assign({},r)}
function calIcon(i){const r=CAL[i];if(r.ess)return['◆',fmtN(r.ess)];if(r.gold)return['●',fmtN(r.gold)];if(r.cry)return['♦',r.cry];if(r.food)return['🍎','×'+r.food];if(r.item)return['🎒',RAR[r.item].n];if(r.myth)return['★','Mythique'];
  return['✧',r.n+' '+(r.sh==='leg'?'légend.':r.sh==='ep'?'épiques':'communs')]}
function openCal(){calSync();const f=calFeat(),can=calClaimable();const dim=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();
  openModal(`${head2('Calendrier du mois')}<div class="calhead"><div id="calC"></div><div><b>Jour 28 : ${spName(f.myth)} mythique</b><div class="mut sm">Connecte-toi chaque jour pour avancer d'une case. ${dim} jours ce mois-ci pour 30 cases : la créature mythique du 28e jour te laisse ${dim-28} jour${dim-28>1?'s':''} de marge.</div>
   <div class="mut sm" style="margin-top:4px">Éclats du mois : ${spName(f.leg)} <span style="color:${RAR[3].c}">légendaire</span> (complet au jour 24) et ${spName(f.ep)} <span style="color:${RAR[2].c}">épique</span>.</div></div></div>
   <div class="calg">${CAL.map((r,i)=>{const[ic,lb]=calIcon(i);return`<div class="cd ${i<S.cal.n?'got':''} ${i===S.cal.n&&can?'now':''} ${r.myth?'big':''}"><span class="dn">${i+1}</span><span class="ic">${ic}</span><span>${lb}</span></div>`}).join('')}</div>
   <div class="acts"><button class="btn gold" id="calGo" ${can?'':'disabled'}>${can?`Récupérer le jour ${S.cal.n+1}`:S.cal.n>=30?'Calendrier terminé':'Reviens demain'}</button></div>`,true);
  liveCanvas($('#calC'),'modal',110,(ctx,t,d)=>drawPortrait(ctx,f.myth,2,110,d,t,{f:1}));
  $('#calGo').onclick=()=>{if(!calClaimable())return;const i=S.cal.n;const r=calReward(i);const out=give(r);S.cal.n++;S.cal.last=dayStr();if(i===27)S.st.cal28=1;accXP(10);save();updDots();
    if(r._c){closeModal();reveal(r._c,r._new,{kind:'gift',rar:4});return}openCal();toast(`🎁 Jour ${i+1} : ${out.join(' · ')}`)}}
function openQuests(tab){ensureQuests();tab=tab||'q';const allC=S.q.list.every(q=>q.c);
  openModal(`${head2(tab==='q'?'Quêtes du jour':'Succès')}<div class="tabs"><button data-qt="q" class="${tab==='q'?'on':''}">Quêtes</button><button data-qt="a" class="${tab==='a'?'on':''}">Succès</button></div><div id="qB"></div>`);
  $('#modal').querySelectorAll('[data-qt]').forEach(b=>b.onclick=()=>openQuests(b.dataset.qt));const B2=$('#qB');
  const rtxt=r=>r.ess?`◆ ${r.ess}`:r.gold?`● ${fmtN(r.gold)}`:`♦ ${r.cry}`;
  if(tab==='q'){S.q.list.forEach(q=>{const d=document.createElement('div');d.className='q'+(q.c?' done':'');
      d.innerHTML=`<div class="f"><b>${q.d}</b><div class="bar"><b style="width:${q.p/q.g*100}%"></b></div><span class="mut sm">${q.p}/${q.g} · ${rtxt(q.r)}</span></div>`+(q.c?'<span>✓</span>':`<button class="btn sm" ${q.p>=q.g?'':'disabled'}>Récupérer</button>`);
      const b=d.querySelector('button');if(b)b.onclick=()=>{q.c=true;give(q.r);accXP(30);save();updDots();openQuests('q')};B2.appendChild(d)});
    B2.insertAdjacentHTML('beforeend',`<div class="q"><span style="font-size:24px">🧰</span><div class="f"><b>Coffre du jour</b><div class="mut sm">Termine les 3 quêtes : un équipement et 10 ♦.</div></div><button class="btn gold sm" id="qCh" ${allC&&!S.q.chest?'':'disabled'}>${S.q.chest?'Ouvert':'Ouvrir'}</button></div><p class="mut sm">Nouvelles quêtes chaque jour à minuit.</p>`);
    $('#qCh').onclick=()=>{if(!allC||S.q.chest)return;S.q.chest=true;const out=give({item:R()<.25?2:1,cry:10});save();updDots();toast('🧰 '+out.join(' · '));openQuests('q')}}
  else ACH.forEach(a=>{const v=a.v(),ok=v>=a.g,got=S.ach[a.id];const d=document.createElement('div');d.className='q'+(got?' done':'');
    d.innerHTML=`<div class="f"><b>${a.n}</b> <span class="mut sm">${a.d}</span><div class="bar"><b style="width:${Math.min(100,v/a.g*100)}%"></b></div><span class="mut sm">${fmtN(Math.min(v,a.g))}/${fmtN(a.g)} · ${rtxt(a.r)}</span></div>`+(got?'<span>🏆</span>':`<button class="btn sm" ${ok?'':'disabled'}>Récupérer</button>`);
    const b=d.querySelector('button');if(b)b.onclick=()=>{S.ach[a.id]=1;give(a.r);save();updDots();openQuests('a')};B2.appendChild(d)})}
function openProfile(){const L=S.acc.lvl;
  openModal(`${head2('Niveau de compte '+L)}<div class="bar"><b style="width:${S.acc.xp/accNeed(L)*100}%"></b></div><div class="mut sm">${S.acc.xp} / ${accNeed(L)} XP — gagnés en combattant, en faisant éclore, en récoltant, en expédition et avec les quêtes. Chaque niveau rapporte de l'essence et des cristaux.</div>
   <h4>Fonctions à débloquer</h4><ul class="ul">${UNL.map(u=>`<li><span>${L>=u.l?'✅':'🔒'} ${u.n}</span><span class="mut">Niveau ${u.l}</span></li>`).join('')}</ul>

   <button class="btn red sm" id="pReset" style="margin-top:12px">Recommencer une partie</button>`);
  $('#pReset').onclick=()=>{if(confirm('Effacer toute ta progression ?')&&confirm('Vraiment ? Cette action est définitive.')){localStorage.removeItem(KEY);location.reload()}}}
