<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Genèse</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Genèse">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0b16">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#0d0b16;--panel:#171427;--panel2:#221d3a;--line:#2f2952;--txt:#efebff;--mut:#9d96c2;--acc:#b48cff;--gold:#f2c94c;--ok:#5fd39a;--bad:#ff6b6b;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.35 -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{padding:calc(var(--st) + 8px) 14px 8px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);z-index:5;border-bottom:1px solid #1c1830}
.logo{font-weight:900;letter-spacing:.2em;font-size:18px;background:linear-gradient(90deg,#ffb347,#b48cff,#8fdcff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hdr{display:flex;gap:6px;align-items:center}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:14px;white-space:nowrap}
.pill b{color:var(--gold)}
main{flex:1;position:relative;overflow:hidden;min-height:0}
.screen{position:absolute;inset:0;overflow-y:auto;padding:14px 14px 24px;display:none;-webkit-overflow-scrolling:touch}
.screen.on{display:block}
#viv{padding:0;overflow:hidden}
#vcan{width:100%;height:100%;display:block;touch-action:none}
#bchips{position:absolute;top:8px;left:0;right:0;display:flex;gap:6px;overflow-x:auto;padding:0 10px;scrollbar-width:none}
#bchips::-webkit-scrollbar{display:none}
#bchips button{flex:none;border:0;border-radius:16px;padding:6px 11px;background:rgba(13,11,22,.62);color:#fff;font-size:12px;font-weight:600;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#bchips button.on{background:var(--acc);color:#16102a}
#bchips button.lock{opacity:.6}
.vhint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(13,11,22,.7);padding:6px 12px;border-radius:14px;font-size:12px;color:#ddd;white-space:nowrap;pointer-events:none;transition:opacity .8s}
nav{display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:var(--sb);z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mut);position:relative}
nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}
nav button .dot{position:absolute;top:5px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
h2{font-size:21px;margin:2px 0 12px}
h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin:20px 0 9px}
h4{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin:16px 0 6px}
.mut{color:var(--mut)} .sm{font-size:12.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;font-size:15px;background:var(--acc);color:#140f24}
.btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.btn.gold{background:linear-gradient(#f7d774,#dfa531);color:#2a1c00}
.btn.red{background:#3a1a24;color:#ff9a9a;border:1px solid #5a2533}
.btn:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:10px}
.cc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 5px 8px;text-align:center;position:relative}
.cc canvas{width:100%;height:auto;aspect-ratio:1;display:block}
.cc .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc .sp{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc .lv{font-size:11px;color:var(--txt);opacity:.85}
.cc .tg{position:absolute;top:6px;left:7px;font-size:12px;color:var(--gold)}
.cc .br{position:absolute;top:6px;right:7px;font-size:12px;color:#ff7fb0}
.cc.sel{outline:2px solid var(--gold)}
.stars{font-size:11px;letter-spacing:1px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:11.5px;padding:3px 8px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.elc{font-size:11.5px;padding:3px 8px;border-radius:10px;color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.sorts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sorts button{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:5px 11px;font-size:12.5px}
.sorts button.on{background:var(--acc);color:#140f24;border-color:var(--acc)}
.daily{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gacha{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.gcard.anc{background:linear-gradient(160deg,#2b2048,#171427);border-color:#5b4a2a}
.gcard canvas{width:96px;height:96px}
.gcard small{color:var(--mut);font-size:11px;line-height:1.3}
.gcard .btn{width:100%}
.incub{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:10px;text-align:center;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.slot.full{border-style:solid}
.slot canvas{width:90px;height:90px}
.slot .t{font-variant-numeric:tabular-nums;font-weight:700}
.slot small{color:var(--mut);font-size:11px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.sw{width:46px;height:28px;border-radius:14px;background:#3a3456;position:relative;border:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--ok)} .sw.on::after{left:21px}
#sheetBg,#modalBg{position:fixed;inset:0;background:rgba(5,3,12,.62);z-index:20;display:flex;align-items:flex-end}
#modalBg{align-items:center;justify-content:center;z-index:30;padding:18px}
#sheet{width:100%;max-height:90%;overflow-y:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:14px 16px calc(18px + var(--sb));border-top:1px solid var(--line);animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#modal{width:100%;max-width:440px;max-height:88vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;animation:pop .22s}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.sh-top{display:flex;gap:12px;align-items:flex-start}
.sh-port canvas{width:120px;height:120px;background:radial-gradient(circle at 50% 70%,#2a2448,#171427 70%);border-radius:16px}
.sh-id{flex:1;min-width:0}
.sh-id input{background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--txt);font-weight:800;font-size:20px;width:100%;padding:2px 0;outline:none}
.row{display:flex;gap:6px;align-items:center}
.mini{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:3px 9px;font-size:14px}
.x{border:0;background:var(--panel2);border-radius:50%;width:32px;height:32px;font-size:15px;flex:none}
.spn{font-weight:700;margin-top:4px}
.bar{height:7px;background:#0b0914;border-radius:4px;overflow:hidden;margin:6px 0 4px}
.bar b{display:block;height:100%;background:linear-gradient(90deg,#8f6bff,#c9a6ff)}
.sb{display:grid;grid-template-columns:72px 1fr 44px;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.sb i{height:7px;background:#0b0914;border-radius:4px;overflow:hidden;display:block}
.sb i b{display:block;height:100%;border-radius:4px}
.sb em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.acts .btn{flex:1 1 45%}
.skilltxt{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px;margin-top:6px}
.team{display:flex;flex-direction:column;gap:10px}
.tslots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ts{background:var(--panel2);border-radius:12px;text-align:center;padding:4px 4px 6px;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px}
.ts canvas{width:80px;height:80px}
.ts.empty{color:var(--mut);border:1px dashed var(--line);background:none;font-size:24px}
.bt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.bt .num{width:32px;height:32px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.bt.boss .num{background:#4a1d2b;color:#ffb3b3}
.bt .bi{flex:1;min-width:0}
.bt .bi b{display:block;font-size:14.5px}
.bt .bi small{color:var(--mut);font-size:12px}
.bt .st{font-size:16px;flex:none}
.bt.done .st{color:var(--ok)}
.bt.open{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.bt.lock{opacity:.45}
.edots{display:flex;gap:3px;margin-top:3px}
.edots i{width:10px;height:10px;border-radius:50%;display:block;border:1px solid rgba(255,255,255,.25)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:7px}
.bx{background:var(--panel);border:1px solid var(--line);border-radius:12px;text-align:center;padding:2px 2px 5px;font-size:10.5px;min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bx canvas{width:62px;height:62px}
.bx.unk{color:#4a4470;font-size:24px;font-weight:800;background:#120f20}
.prog{height:10px;background:#0b0914;border-radius:5px;overflow:hidden;margin:8px 0 2px}
.prog b{display:block;height:100%;background:linear-gradient(90deg,#ffb347,#b48cff,#8fdcff)}
#battle{position:fixed;inset:0;z-index:15;background:#000;display:flex;flex-direction:column}
.btop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(var(--st) + 6px) 10px 6px;background:var(--bg)}
.btop .x{background:var(--panel2)}
#bTitle{font-weight:800;font-size:15px;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bSpeed{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:5px 12px;font-weight:800}
#bcan{flex:1;width:100%;display:block;min-height:0;touch-action:none}
#bSkills{display:flex;gap:8px;padding:8px 10px calc(10px + var(--sb));background:var(--bg)}
.skill{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:7px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px}
.skill .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.skill .sk{font-size:11px;color:var(--mut)}
.skill .bar{width:100%;height:6px;margin:2px 0 0}
.skill .bar b{background:var(--gold);width:0}
.skill.ready{border-color:var(--gold);animation:glow 0.9s infinite alternate}
.skill.ready .sk{color:var(--gold);font-weight:800}
.skill.dead{opacity:.35}
@keyframes glow{from{box-shadow:0 0 4px rgba(242,201,76,.3)}to{box-shadow:0 0 16px rgba(242,201,76,.8)}}
#toasts{position:fixed;top:calc(var(--st) + 54px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:40;pointer-events:none}
.toast{background:rgba(34,29,58,.97);border:1px solid var(--line);padding:8px 14px;border-radius:14px;font-size:13px;max-width:92%;box-shadow:0 6px 20px rgba(0,0,0,.45);animation:tin .3s;transition:opacity .4s,transform .4s;text-align:center}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
.reveal{text-align:center}
.reveal canvas{width:240px;height:240px;display:block;margin:0 auto}
.reveal .new{display:inline-block;background:linear-gradient(90deg,#ffb347,#ff6fa8);color:#2a0a14;font-weight:800;font-size:12px;padding:4px 10px;border-radius:10px;margin:6px 0}
.win{color:var(--gold);text-align:center;font-size:26px}
.lose{color:var(--bad);text-align:center;font-size:26px}
.rew{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.rew div{background:var(--panel2);border-radius:10px;padding:7px 10px;font-size:13.5px}
ul.intro{padding-left:18px;margin:8px 0 14px}
ul.intro li{margin:7px 0}
</style>
</head>
<body>
<div id="app">
  <header><div class="logo">GENÈSE</div><div class="hdr"><span id="dn" class="pill">☀</span><span class="pill">◆ <b id="ess">0</b></span></div></header>
  <main>
    <section id="viv" class="screen on">
      <canvas id="vcan"></canvas>
      <div id="bchips"></div>
      <div id="vhint" class="vhint">Touche le sol pour déposer un fruit · glisse pour explorer</div>
    </section>
    <section id="eggs" class="screen"></section>
    <section id="crea" class="screen"></section>
    <section id="best" class="screen"></section>
    <section id="fight" class="screen"></section>
  </main>
  <nav id="nav">
    <button data-s="viv" class="on"><svg viewBox="0 0 24 24"><path d="M2 19c3-5 6-8 10-8s7 3 10 8z"/><circle cx="17" cy="6" r="2.5"/></svg><span>Vivarium</span></button>
    <button data-s="eggs"><svg viewBox="0 0 24 24"><path d="M12 3c-4 0-7 6.5-7 10.5a7 7 0 0 0 14 0C19 9.5 16 3 12 3z"/></svg><span>Œufs</span><i class="dot hidden" id="eggDot"></i></button>
    <button data-s="crea"><svg viewBox="0 0 24 24"><circle cx="7" cy="9" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="17" cy="9" r="2"/><path d="M8 17c0-3 2-5 4-5s4 2 4 5-2 3-4 3-4 0-4-3z"/></svg><span>Créatures</span></button>
    <button data-s="best"><svg viewBox="0 0 24 24"><path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"/></svg><span>Bestiaire</span></button>
    <button data-s="fight"><svg viewBox="0 0 24 24"><path d="M14 4h6v6l-9 9-3-3zM4 4h6l2 2M4 4v6l2 2M7 17l-3 3M17 17l3 3M15 15l-2 2"/></svg><span>Combats</span></button>
  </nav>
</div>
<div id="sheetBg" class="hidden"><div id="sheet"></div></div>
<div id="modalBg" class="hidden"><div id="modal"></div></div>
<div id="battle" class="hidden">
  <div class="btop"><button class="x" id="bQuit">✕</button><div id="bTitle"></div><button id="bSpeed">x1</button></div>
  <canvas id="bcan"></canvas>
  <div id="bSkills"></div>
</div>
<div id="toasts"></div>

<script>
'use strict';
/* ================= Utilitaires ================= */
const $=s=>document.querySelector(s);
const TAU=Math.PI*2, R=Math.random;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(R()*a.length)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hex2rgb(h){const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]}
function rgb2hex(r,g,b){return'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('')}
function hexA(h,a){const c=hex2rgb(h);return`rgba(${c[0]},${c[1]},${c[2]},${a})`}
function mix(h1,h2,t){const a=hex2rgb(h1),b=hex2rgb(h2);return rgb2hex(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t)}
function shade(h,amt){return amt>0?mix(h,'#ffffff',amt):mix(h,'#000000',-amt)}
function hue(h,deg){
  let[r,g,b]=hex2rgb(h).map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let Hh=0,Ss=0;const L=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;Ss=L>.5?d/(2-mx-mn):d/(mx+mn);Hh=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;Hh/=6}
  if(Ss===0)return h;Hh=((Hh+deg/360)%1+1)%1;
  const f=(p,q,t)=>{t=(t%1+1)%1;return t<1/6?p+(q-p)*6*t:t<1/2?q:t<2/3?p+(q-p)*(2/3-t)*6:p};
  const q=L<.5?L*(1+Ss):L+Ss-L*Ss,p=2*L-q;return rgb2hex(f(p,q,Hh+1/3)*255,f(p,q,Hh)*255,f(p,q,Hh-1/3)*255)}
function addEll(p,cx,cy,rx,ry,rot){p.moveTo(cx+rx*Math.cos(rot),cy+rx*Math.sin(rot));p.ellipse(cx,cy,rx,ry,rot,0,TAU)}
function fmtT(ms){const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function dayStr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}

/* ================= Données du monde ================= */
const EL=[
  {name:'Feu',c:'#e2542b',a:'#ffb347',pre:'Pyr',sec:'flam'},
  {name:'Eau',c:'#2f7fe0',a:'#8fdcff',pre:'Aqu',sec:'mar'},
  {name:'Terre',c:'#8a6a3b',a:'#d6b57c',pre:'Gé',sec:'rok'},
  {name:'Air',c:'#56b8a4',a:'#e4fff8',pre:'Zéph',sec:'vent'},
  {name:'Ombre',c:'#5a3f8c',a:'#c39bff',pre:'Nyx',sec:'umbr'},
  {name:'Lumière',c:'#e2b93b',a:'#fff6c9',pre:'Lum',sec:'sol'},
];
const MORPH=[{name:'Boule',suf:'on'},{name:'Quadrupède',suf:'ard'},{name:'Serpent',suf:'is'},{name:'Oiseau',suf:'elle'},{name:'Insecte',suf:'ide'}];
const TEMP=[{n:'Curieux'},{n:'Agressif'},{n:'Timide'},{n:'Joueur'},{n:'Paresseux'},{n:'Sociable'}];
const RAR=[{n:'Commun',c:'#c3bedf'},{n:'Rare',c:'#5fb8ff'},{n:'Épique',c:'#c77dff'},{n:'Légendaire',c:'#f2c94c'}];
const BIOMES=[
  {n:'Prairie des Origines',s:'Prairie',el:[2,3],unlock:0},
  {n:'Lac des Brumes',s:'Lac',el:[1],unlock:0},
  {n:'Volcan Cendré',s:'Volcan',el:[0],unlock:2},
  {n:"Forêt d'Ombre",s:'Forêt',el:[4],unlock:5},
  {n:'Grotte de Cristal',s:'Grotte',el:[5],unlock:8},
];
const SK=[
  {n:'Brasier',d:'Frappe un ennemi avec une puissance énorme.'},
  {n:'Déferlante',d:'Touche tous les ennemis à la fois.'},
  {n:'Rempart',d:"Protège toute l'équipe : dégâts reçus divisés par deux."},
  {n:'Bourrasque',d:'Deux frappes rapides.'},
  {n:'Drain',d:'Frappe un ennemi et récupère une partie des dégâts en PV.'},
  {n:'Aurore',d:"Soigne toute l'équipe."},
];
const BEATS={1:[0],0:[3],3:[2],2:[1],4:[5],5:[4]};
const BNAMES=['Les Hautes Herbes','Le Gué des Brumes','Rives silencieuses','Pentes cendrées','Le Gardien du Cratère','Lisière pourpre','Le Bois sans lune','Échos de quartz','La Faille lumineuse',"L'Ancien des Origines"];
const CAP=30, SLOTS=4, KEY='genese-v1', TOTAL_SP=105;
const SY1=['Ka','Lu','Mi','Zo','Ri','Na','Té','Vo','Shi','Pa','Ro','El','Yu','Fé','Ki','Ma','Bo','Ny','Sa','Ul','Ji','Or','Ké','Lo'];
const SY2=['ro','ki','la','mi','no','ra','zu','li','vé','ta','ko','né','ri','sa','do','bi'];
const nick=()=>pick(SY1)+pick(SY2)+(R()<.3?pick(['n','x','s','l','m']):'');

/* ================= Génétique ================= */
function spKey(g){const a=Math.min(g.el[0],g.el[1]),b=Math.max(g.el[0],g.el[1]);return a+'-'+b+'-'+g.m}
function spName(g){const a=Math.min(g.el[0],g.el[1]),b=Math.max(g.el[0],g.el[1]);const s=MORPH[g.m].suf;return a===b?EL[a].pre+s:EL[a].pre+'o'+EL[b].sec+s}
function statTotal(g){const s=g.stats;return s.hp+s.atk+s.def+s.spd}
function rarity(g){const t=statTotal(g);return t>=33?3:t>=27?2:t>=20?1:0}
function genStats(rar,rng){const rg=[[12,19],[20,26],[27,32],[33,38]][rar];const tot=rg[0]+Math.floor(rng()*(rg[1]-rg[0]+1));const s=[1,1,1,1];let rem=tot-4;while(rem>0){const i=Math.floor(rng()*4);if(s[i]<10){s[i]++;rem--}}return{hp:s[0],atk:s[1],def:s[2],spd:s[3]}}
function newGenome(rar,e1,e2,rng){rng=rng||R;
  return{el:[e1,e2],m:Math.floor(rng()*5),horns:rng()<.45?1+Math.floor(rng()*3):0,tail:Math.floor(rng()*4),wings:rng()<.28?1:0,
    eyes:rng()<.12?1:rng()<.86?2:3,pat:Math.floor(rng()*3),hue:Math.round(rng()*36-18),size:Math.round((.88+rng()*.24)*100)/100,
    stats:genStats(rar,rng),temp:Math.floor(rng()*6)}}
function breed(a,b){
  const P=()=>R()<.5?a:b, mut=p=>R()<p;
  let e1=a.el[R()<.5?0:1], e2=b.el[R()<.5?0:1];
  if(R()<.5){const t=e1;e1=e2;e2=t}
  if(mut(.08))e2=Math.floor(R()*6);
  const st={};['hp','atk','def','spd'].forEach(k=>{let v=Math.round((a.stats[k]+b.stats[k])/2+(R()*3-1));if(mut(.1))v+=2;st[k]=clamp(v,1,10)});
  return{el:[e1,e2],m:mut(.08)?Math.floor(R()*5):P().m,horns:mut(.12)?Math.floor(R()*4):P().horns,tail:mut(.12)?Math.floor(R()*4):P().tail,
    wings:mut(.12)?(R()<.5?1:0):P().wings,eyes:mut(.1)?1+Math.floor(R()*3):P().eyes,pat:mut(.12)?Math.floor(R()*3):P().pat,
    hue:clamp(Math.round((a.hue+b.hue)/2+R()*12-6),-24,24),size:Math.round(clamp((a.size+b.size)/2+R()*.08-.04,.82,1.2)*100)/100,
    stats:st,temp:mut(.15)?Math.floor(R()*6):P().temp}}
const xpNeed=l=>18+l*12;
const stageFor=l=>l>=14?2:l>=6?1:0;
function stats(c){const s=c.g.stats,L=c.lvl,m=[1,1.12,1.28][c.stage];
  return{hp:Math.round((40+s.hp*9+L*7)*m),atk:Math.round((6+s.atk*2.2+L*1.8)*m),def:Math.round((3+s.def*1.6+L*1.1)*m),spd:Math.round(8+s.spd*1.5+L*.4)}}
function effMult(a,d){const m=x=>BEATS[a].includes(x)?1.5:(a<4&&x<4&&BEATS[x].includes(a))?.7:1;return(m(d[0])+m(d[1]))/2}

/* ================= État & sauvegarde ================= */
let S;
function makeCreature(g,o){o=o||{};const lvl=o.lvl||1;
  return{id:S.nextId++,name:o.name||nick(),g,lvl,xp:0,stage:stageFor(lvl),gen:o.gen||1,parents:o.parents||null,born:Date.now(),hunger:80,energy:85,social:60,exp:[0,0,0,0,0,0],cd:0}}
function newGame(){
  S={v:1,ess:200,nextId:1,crea:[],eggs:[],best:{},prog:0,team:[],daily:'',pity:0,aff:{},speed:1,free:true,intro:false,lastSeen:Date.now(),sort:'rar'};
  const els=[0,1,2,3].sort(()=>R()-.5).slice(0,3);
  els.forEach((e,i)=>{const c=makeCreature(newGenome(i===0?1:0,e,e),{lvl:2});S.crea.push(c);S.team.push(c.id);discover(c.g,true)});
}
function load(){try{const t=localStorage.getItem(KEY);if(!t)return false;const d=JSON.parse(t);if(!d||!Array.isArray(d.crea))return false;
  S=Object.assign({v:1,ess:0,nextId:1,crea:[],eggs:[],best:{},prog:0,team:[],daily:'',pity:0,aff:{},speed:1,free:true,intro:true,lastSeen:Date.now(),sort:'rar'},d);
  S.crea.forEach(c=>{c.stage=stageFor(c.lvl);c.exp=c.exp||[0,0,0,0,0,0]});return true}catch(e){return false}}
function save(){try{S.lastSeen=Date.now();
  for(const c of S.crea){if(c._x!=null&&V.BW){c.fx=c._x/V.BW;c.fy=(c._y-V.gt)/Math.max(1,V.gb-V.gt)}}
  localStorage.setItem(KEY,JSON.stringify(S,(k,v)=>k[0]==='_'?undefined:v))}catch(e){}}
const byId=id=>S.crea.find(c=>c.id===id);
function discover(g,silent){const k=spKey(g);if(S.best[k])return false;
  S.best[k]={t:Date.now(),g:JSON.parse(JSON.stringify(g,(k2,v)=>k2[0]==='_'?undefined:v))};
  if(!silent){S.ess+=20;updEss();toast(`📖 Nouvelle espèce : <b>${spName(g)}</b> (+20 ◆)`)}return true}
const affKey=(a,b)=>a.id<b.id?a.id+'_'+b.id:b.id+'_'+a.id;
function getAff(a,b){const k=affKey(a,b);if(S.aff[k]==null){let v=R()*20-10;if(a.g.el.some(e=>b.g.el.includes(e)))v+=20;const ts=[a.g.temp,b.g.temp];if(ts.includes(5))v+=12;if(ts.includes(3))v+=8;if(ts.includes(1))v-=15;if(ts.includes(2))v-=5;S.aff[k]=Math.round(v)}return S.aff[k]}
function changeAff(a,b,d){const k=affKey(a,b);S.aff[k]=clamp(getAff(a,b)+d,-100,100)}
function addXP(c,n,quiet){const ev=[];if(c.lvl>=40)return ev;c.xp+=n;
  while(c.lvl<40&&c.xp>=xpNeed(c.lvl)){c.xp-=xpNeed(c.lvl);c.lvl++;ev.push(`⬆️ ${esc(c.name)} passe au niveau ${c.lvl}`);if(stageFor(c.lvl)>c.stage)ev.push(evolve(c))}
  if(!quiet)ev.filter(m=>m[0]==='✨').forEach(m=>toast(m));return ev}
function evolve(c){c.stage=stageFor(c.lvl);const old=spName(c.g);
  const k=['hp','atk','def','spd'][Math.floor(R()*4)];c.g.stats[k]=Math.min(10,c.g.stats[k]+1);
  let best=-1,bv=0;c.exp.forEach((v,i)=>{if(v>bv&&!c.g.el.includes(i)){bv=v;best=i}});
  let msg;
  if(best>=0&&bv>=120){c.g.el[1]=best;msg=`✨ ${esc(c.name)} évolue et mute sous l'influence du milieu : ${old} → <b>${spName(c.g)}</b>`;discover(c.g)}
  else msg=`✨ ${esc(c.name)} évolue au stade ${c.stage+1} !`;
  c.exp=[0,0,0,0,0,0];return msg}
const nUnl=()=>BIOMES.filter(b=>b.unlock<=S.prog).length;
const popFull=()=>S.crea.length+S.eggs.length>=CAP;

/* ================= Couleurs & dessin des créatures ================= */
function colors(g){const sig=g.el[0]+','+g.el[1]+','+g.hue;if(g._c&&g._c.sig===sig)return g._c;
  const e1=EL[g.el[0]],e2=EL[g.el[1]],pure=g.el[0]===g.el[1],body=hue(e1.c,g.hue);
  return g._c={sig,body,light:shade(body,.32),dark:shade(body,-.32),dark2:shade(body,-.58),acc:pure?e1.a:e2.c,acc2:pure?shade(e1.a,-.18):e2.a}}
function fillBody(ctx,p,C,g,cx,cy,r){
  ctx.strokeStyle=C.dark2;ctx.lineWidth=Math.max(1.5,r*.14);ctx.stroke(p);
  const gr=ctx.createLinearGradient(0,cy-r,0,cy+r);gr.addColorStop(0,C.light);gr.addColorStop(.55,C.body);gr.addColorStop(1,C.dark);ctx.fillStyle=gr;ctx.fill(p);
  if(g.pat){ctx.save();ctx.clip(p);ctx.fillStyle=hexA(C.acc,.75);
    if(g.pat===1){const sd=Math.abs(g.hue)+3;for(let i=0;i<6;i++){const a=i*2.4+sd,d=r*(.25+((i*37+sd*7)%10)/16);ctx.beginPath();ctx.arc(cx+Math.cos(a)*d,cy+Math.sin(a)*d*.75,r*(.11+(i%3)*.05),0,TAU);ctx.fill()}}
    else{for(let i=-3;i<=3;i++){ctx.beginPath();ctx.ellipse(cx+i*r*.42,cy-r*.3,r*.09,r*1.1,.25,0,TAU);ctx.fill()}}
    ctx.restore()}
  ctx.fillStyle='rgba(255,255,255,.16)';ctx.beginPath();ctx.ellipse(cx-r*.25,cy-r*.45,r*.35,r*.18,-.4,0,TAU);ctx.fill()}
function drawHead(ctx,C,h,snout){const p=new Path2D();addEll(p,h.x,h.y,h.r,h.r,0);if(snout)addEll(p,h.x+h.r*.72,h.y+h.r*.28,h.r*.5,h.r*.36,0);
  ctx.strokeStyle=C.dark2;ctx.lineWidth=Math.max(1.5,h.r*.16);ctx.stroke(p);
  const gr=ctx.createLinearGradient(0,h.y-h.r,0,h.y+h.r);gr.addColorStop(0,C.light);gr.addColorStop(1,C.body);ctx.fillStyle=gr;ctx.fill(p)}
function drawEyes(ctx,g,h,sleep,t,mouth){
  const n=g.eyes,er=h.r*(n===1?.34:n===2?.25:.2);
  const pos=n===1?[[.36,-.12]]:n===2?[[.08,-.2],[.52,-.14]]:[[0,-.3],[.42,-.34],[.3,.08]];
  const blink=sleep||((t+g.hue*.37+20)%4.3)<.13;
  for(const[px,py]of pos){const ex=h.x+px*h.r,ey=h.y+py*h.r;
    if(blink){ctx.strokeStyle='#1a1426';ctx.lineWidth=Math.max(1,er*.35);ctx.beginPath();ctx.arc(ex,ey,er*.75,.25,Math.PI-.25);ctx.stroke();continue}
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,er,0,TAU);ctx.fill();
    ctx.fillStyle=g.temp===1?'#9c1028':'#1a1426';ctx.beginPath();ctx.arc(ex+er*.28,ey+er*.06,er*.58,0,TAU);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex+er*.45,ey-er*.28,er*.22,0,TAU);ctx.fill();
    if(g.temp===1){ctx.strokeStyle='#1a1426';ctx.lineWidth=Math.max(1,er*.4);ctx.beginPath();ctx.moveTo(ex-er,ey-er*1.35);ctx.lineTo(ex+er,ey-er*.85);ctx.stroke()}
    if(g.temp===2){ctx.fillStyle='rgba(255,120,150,.45)';ctx.beginPath();ctx.ellipse(ex,ey+er*1.4,er*.7,er*.35,0,0,TAU);ctx.fill()}}
  if(mouth){ctx.strokeStyle='#1a1426';ctx.lineWidth=Math.max(1,h.r*.08);ctx.beginPath();const mx=mouth[0],my=mouth[1];
    if(g.temp===3||g.temp===5||sleep===false&&g.temp===0)ctx.arc(mx,my-h.r*.1,h.r*.15,.25,Math.PI-.25);else{ctx.moveTo(mx-h.r*.14,my);ctx.lineTo(mx+h.r*.12,my-h.r*.02)}ctx.stroke()}}
function drawHorns(ctx,type,C,h,stage){
  const hr=h.r,top=h.y-hr*.8,col=stage>=2?C.acc2:'#efe6d2',dk=stage>=2?C.acc:'#8c7f6a';
  ctx.fillStyle=col;ctx.strokeStyle=dk;ctx.lineWidth=Math.max(1,hr*.07);
  if(type===1){for(const dx of[-.2,.3]){ctx.beginPath();ctx.moveTo(h.x+(dx-.15)*hr,top+hr*.2);ctx.lineTo(h.x+(dx+.04)*hr,top-hr*.55);ctx.lineTo(h.x+(dx+.17)*hr,top+hr*.25);ctx.closePath();ctx.fill();ctx.stroke()}}
  else if(type===2){ctx.lineWidth=hr*.2;ctx.strokeStyle=col;for(const dx of[-.15,.3]){ctx.beginPath();ctx.arc(h.x+dx*hr-hr*.25,top+hr*.05,hr*.32,.1,Math.PI*1.15,true);ctx.stroke()}}
  else if(type===3){for(let i=0;i<3;i++){const bx=h.x+(-.38+i*.36)*hr;ctx.beginPath();ctx.moveTo(bx-hr*.13,top+hr*.25);ctx.lineTo(bx,top-hr*(.42+(i===1?.28:0)));ctx.lineTo(bx+hr*.13,top+hr*.25);ctx.closePath();ctx.fill();ctx.stroke()}}}
function drawTail(ctx,type,C,x,y,r,t){
  const sw=Math.sin(t*4)*.25;ctx.save();ctx.translate(x,y);ctx.rotate(-.45+sw);
  if(type===1){ctx.strokeStyle=C.dark;ctx.lineWidth=r*.2;ctx.beginPath();ctx.moveTo(r*.1,0);ctx.quadraticCurveTo(-r*.6,-r*.05,-r*.9,-r*.6);ctx.stroke();ctx.fillStyle=C.acc;ctx.beginPath();ctx.arc(-r*.93,-r*.66,r*.22,0,TAU);ctx.fill()}
  else if(type===2){for(let i=0;i<3;i++){ctx.fillStyle=i%2?C.acc2:C.acc;const fl=Math.sin(t*9+i)*r*.06;ctx.beginPath();ctx.ellipse(-r*(.3+i*.27),-r*(.12+i*.24)+fl,r*(.34-i*.07),r*(.22-i*.04),-.6,0,TAU);ctx.fill()}}
  else if(type===3){ctx.fillStyle=C.dark;ctx.beginPath();ctx.moveTo(r*.1,-r*.18);ctx.lineTo(-r*1.05,-r*.32);ctx.lineTo(r*.1,r*.16);ctx.fill();ctx.fillStyle=C.acc;for(let i=0;i<3;i++){const px=-r*(.2+i*.27);ctx.beginPath();ctx.moveTo(px-r*.09,-r*.12);ctx.lineTo(px,-r*.42);ctx.lineTo(px+r*.09,-r*.1);ctx.fill()}}
  ctx.restore()}
function drawWings(ctx,C,x,y,r,t,sleep){
  const a=sleep?.1:Math.sin(t*7)*.4;
  for(const s of[0,1]){ctx.save();ctx.translate(x+(s?r*.18:-r*.06),y);ctx.rotate(-.85-a+(s?.4:0));
    ctx.fillStyle=hexA(C.acc,s?.85:.55);ctx.strokeStyle=hexA(C.dark2,.8);ctx.lineWidth=Math.max(1,r*.06);
    ctx.beginPath();ctx.ellipse(0,-r*.6,r*.3,r*.72,.15,0,TAU);ctx.fill();ctx.stroke();
    ctx.strokeStyle=hexA(C.dark2,.4);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(r*.05,-r*1.15);ctx.stroke();ctx.restore()}}
function drawCreature(ctx,g,stage,x,y,s,t,o){
  o=o||{};const C=colors(g),rar=rarity(g);
  const k=s*g.size*(1+stage*.2),r=13*k,walk=!!o.walk,sleep=!!o.sleep;
  const bob=sleep?Math.sin(t*1.6)*r*.03:Math.sin(t*(walk?11:3))*r*(walk?.07:.035);
  const ph=walk?t*11:0;
  ctx.save();ctx.translate(x+(o.shake?Math.sin(t*50)*r*.12:0),y);
  if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  ctx.fillStyle='rgba(0,0,0,.24)';ctx.beginPath();ctx.ellipse(0,0,r*1.35,r*.3,0,0,TAU);ctx.fill();
  if(o.rot)ctx.rotate(o.rot);
  ctx.scale(o.f||1,1);
  if(stage>=2||rar>=3){const cy=-r*1.2;const gr=ctx.createRadialGradient(0,cy,r*.3,0,cy,r*2.3);const pulse=.32+Math.sin(t*2)*.08;gr.addColorStop(0,hexA(C.acc,pulse));gr.addColorStop(1,hexA(C.acc,0));ctx.fillStyle=gr;ctx.beginPath();ctx.arc(0,cy,r*2.3,0,TAU);ctx.fill()}
  ctx.lineJoin='round';ctx.lineCap='round';
  const horns=g.horns||(stage>=1?1:0);let head,body;
  if(g.m===0){ // Boule
    const cy=-r*1.05+bob;head={x:r*.3,y:cy-r*.2,r:r*.82};
    ctx.fillStyle=C.dark;for(const sx of[-1,1]){const lift=walk?Math.max(0,Math.sin(ph+(sx>0?0:Math.PI)))*r*.25:0;ctx.beginPath();ctx.ellipse(sx*r*.45,-r*.12-lift,r*.34,r*.2,0,0,TAU);ctx.fill()}
    if(g.tail)drawTail(ctx,g.tail,C,-r*.85,cy+r*.25,r,t);
    if(g.wings)drawWings(ctx,C,-r*.15,cy-r*.5,r,t,sleep);
    if(horns)drawHorns(ctx,horns,C,{x:head.x-r*.1,y:cy-r*.35,r:r*.85},stage);
    body=new Path2D();addEll(body,0,cy,r,r*(1+Math.sin(t*3)*.03),0);fillBody(ctx,body,C,g,0,cy,r);
    drawEyes(ctx,g,head,sleep,t,[head.x+head.r*.62,head.y+head.r*.42]);
  }else if(g.m===1){ // Quadrupède
    const cy=-r*1.1+bob;head={x:r*1.15,y:cy-r*.55,r:r*.62};
    ctx.strokeStyle=C.dark;ctx.lineWidth=r*.3;
    [-r*.85,-r*.45,r*.35,r*.75].forEach((lx,i)=>{const sw=walk?Math.sin(ph+(i%2?Math.PI:0))*r*.3:0;ctx.beginPath();ctx.moveTo(lx,cy+r*.3);ctx.lineTo(lx+sw,-r*.14);ctx.stroke()});
    if(g.tail)drawTail(ctx,g.tail,C,-r*1.25,cy-r*.1,r,t);
    if(g.wings)drawWings(ctx,C,-r*.25,cy-r*.45,r,t,sleep);
    if(horns)drawHorns(ctx,horns,C,head,stage);
    body=new Path2D();addEll(body,-r*.05,cy,r*1.3,r*.72,0);fillBody(ctx,body,C,g,0,cy,r);
    drawHead(ctx,C,head,true);drawEyes(ctx,g,head,sleep,t,[head.x+head.r*.95,head.y+head.r*.48]);
  }else if(g.m===2){ // Serpent
    const n=6,segs=[];for(let i=0;i<n;i++)segs.push([-i*r*.5-r*.1,-r*.52-Math.sin(t*(walk?8:2.5)-i*.9)*r*.14,r*(.6-i*.055)]);
    head={x:r*.5,y:-r*1.45+bob,r:r*.56};
    const ls=segs[n-1];if(g.tail)drawTail(ctx,g.tail,C,ls[0]-ls[2]*.6,ls[1],r*.8,t);
    if(g.wings)drawWings(ctx,C,segs[1][0],segs[1][1]-r*.4,r*.9,t,sleep);
    if(horns)drawHorns(ctx,horns,C,head,stage);
    body=new Path2D();segs.forEach(sg=>addEll(body,sg[0],sg[1],sg[2],sg[2]*.92,0));addEll(body,r*.25,-r*.95+bob*.5,r*.34,r*.56,-.45);
    fillBody(ctx,body,C,g,-r*1.2,-r*.6,r*1.3);
    drawHead(ctx,C,head,true);drawEyes(ctx,g,head,sleep,t,[head.x+head.r*.95,head.y+head.r*.48]);
    if(!sleep&&Math.sin(t*3)>.85){ctx.strokeStyle='#ff5a7a';ctx.lineWidth=Math.max(1,r*.06);ctx.beginPath();ctx.moveTo(head.x+head.r*1.2,head.y+head.r*.3);ctx.lineTo(head.x+head.r*1.6,head.y+head.r*.32);ctx.stroke()}
  }else if(g.m===3){ // Oiseau
    const cy=-r*1.15+bob;head={x:r*.55,y:cy-r*.62,r:r*.55};
    ctx.strokeStyle='#d99a3a';ctx.lineWidth=Math.max(1.5,r*.1);
    for(const sx of[-1,1]){const sw=walk?Math.sin(ph+(sx>0?0:Math.PI))*r*.2:0;ctx.beginPath();ctx.moveTo(sx*r*.22,cy+r*.6);ctx.lineTo(sx*r*.22+sw,-r*.05);ctx.lineTo(sx*r*.22+sw+r*.18,0);ctx.stroke()}
    for(let i=-1;i<=1;i++){ctx.fillStyle=i?C.acc:C.dark;ctx.beginPath();ctx.ellipse(-r*1.05,cy+r*.05+i*r*.18,r*.5,r*.14,i*.25+.15,0,TAU);ctx.fill()}
    const fl=sleep?0:Math.sin(t*(walk?14:5))*.5;
    ctx.save();ctx.translate(-r*.1,cy-r*.3);ctx.rotate(-.9-fl);ctx.fillStyle=C.dark;ctx.beginPath();ctx.ellipse(0,-r*.5,r*.28,r*.65,0,0,TAU);ctx.fill();ctx.restore();
    if(horns)drawHorns(ctx,horns,C,head,stage);
    body=new Path2D();addEll(body,0,cy,r*.95,r*.85,0);fillBody(ctx,body,C,g,0,cy,r);
    drawHead(ctx,C,head,false);
    ctx.fillStyle='#f0b13c';ctx.strokeStyle='#8a5a12';ctx.lineWidth=Math.max(1,r*.05);ctx.beginPath();ctx.moveTo(head.x+head.r*.8,head.y-head.r*.12);ctx.lineTo(head.x+head.r*1.5,head.y+head.r*.12);ctx.lineTo(head.x+head.r*.8,head.y+head.r*.36);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.save();ctx.translate(-r*.2,cy-r*.05);ctx.rotate(.2+fl*.7);ctx.fillStyle=C.acc;ctx.strokeStyle=C.dark2;ctx.lineWidth=Math.max(1,r*.06);ctx.beginPath();ctx.ellipse(-r*.2,0,r*.62,r*.32,-.15,0,TAU);ctx.fill();ctx.stroke();ctx.restore();
    drawEyes(ctx,g,head,sleep,t,null);
  }else{ // Insecte
    const cy=-r*1.0+bob;head={x:r*.85,y:cy-r*.22,r:r*.46};
    ctx.strokeStyle=C.dark2;ctx.lineWidth=Math.max(1.2,r*.1);
    for(let i=0;i<3;i++)for(const side of[0,1]){const bx=-r*.3+i*r*.33,sw=walk?Math.sin(ph+i*2+(side?Math.PI:0))*r*.2:0,dir=(i-1)*.35+(side?.15:-.15);

function simViv(dt){if(!V.BW)return;const now=Date.now(),night=isNight(),nb=nUnl();

function drawFruit(ctx,x,y,el,t){const e=EL[el];ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(x,y,6,2,0,0,TAU);ctx.fill();

  ctx.fillStyle='#4caa4a';ctx.beginPath();ctx.ellipse(x+2,yy-6,3,1.6,-.6,0,TAU);ctx.fill()}

    if(c===V.sel){ctx.font='700 12px -apple-system,system-ui,sans-serif';ctx.textAlign='center';const tw=ctx.measureText(c.name).width+14;const yy=c._y-13*VS*c.g.size*(1+c.stage*.2)*2.9-14;ctx.fillStyle='rgba(13,11,22,.8)';ctx.beginPath();ctx.roundRect?ctx.roundRect(x-tw/2,yy-12,tw,18,9):ctx.rect(x-tw/2,yy-12,tw,18);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(c.name,x,yy+1)}}

  const na=isNightAmt();if(na>0){for(let i=i0;i<=i1;i++){ctx.fillStyle=`rgba(10,8,45,${na*[.42,.42,.25,.12,.12][i]})`;ctx.fillRect(i*BW-V.cam,0,BW,H)}

    ctx.fillStyle='#b5aee0';ctx.font='13px -apple-system,system-ui,sans-serif';ctx.fillText(`Débloqué après la bataille ${b.unlock}`,ox+BW/2,H*.42+56)}
  const ci=clamp(Math.floor((V.cam+W/2)/BW),0,4);if(ci!==V.chip){V.chip=ci;document.querySelectorAll('#bchips button').forEach((b,i)=>b.classList.toggle('on',i===ci))}}

      ctx.font='700 11px -apple-system,system-ui,sans-serif';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(`${f.c.name.length>11?f.c.name.slice(0,10)+'.':f.c.name} · ${f.c.lvl}`,f.x,by-5);
      ctx.fillStyle=EL[f.c.g.el[0]].c;ctx.beginPath();ctx.arc(bx-6,by+3,4,0,TAU);ctx.fill()}}
  for(const p of B.parts){ctx.globalAlpha=clamp(p.life*1.5,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill()}ctx.globalAlpha=1;
  ctx.textAlign='center';for(const p of B.floats){ctx.globalAlpha=clamp(p.life*1.5,0,1);ctx.font=`900 ${Math.round(17*p.sz)}px -apple-system,system-ui,sans-serif`;ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.7)';ctx.strokeText(p.txt,p.x,p.y);ctx.fillStyle=p.col;ctx.fillText(p.txt,p.x,p.y)}ctx.globalAlpha=1;
  if(B.banner){const a=clamp(B.banner.t*2,0,1);ctx.globalAlpha=a;ctx.font='900 30px -apple-system,system-ui,sans-serif';ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.75)';ctx.strokeText(B.banner.txt,W/2,H*.7);ctx.fillStyle=B.banner.col;ctx.fillText(B.banner.txt,W/2,H*.7);ctx.globalAlpha=1}
  if(B.t<1.4&&!B.over){ctx.globalAlpha=clamp(1.4-B.t,0,1);ctx.font='900 34px -apple-system,system-ui,sans-serif';ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.75)';ctx.strokeText('Combat !',W/2,H*.7);ctx.fillStyle='#fff';ctx.fillText('Combat !',W/2,H*.7);ctx.globalAlpha=1}
  for(const f of B.fs)if(f.btn){const rd=f.alive&&f.ch>=100&&!B.over;f.btn.classList.toggle('ready',rd);f.btn.classList.toggle('dead',!f.alive);f.btn.querySelector('.bar b').style.width=f.ch+'%'}}
function bResult(win){const n=B.n,first=win&&n>S.prog;const team=B.fs.filter(f=>f.side===0).map(f=>f.c);
  let ess=win?25+n*10:5+n*2;if(first)ess*=2;S.ess+=ess;const xp=win?14+n*9:Math.round((14+n*9)/3);
  const ev=[];team.forEach(c=>{if(byId(c.id))ev.push(...addXP(c,xp,true))});
  const unl=[];if(first){S.prog=n;BIOMES.forEach(b=>{if(b.unlock===n)unl.push(b.n)});renderChips()}
  save();updEss();
  openModal(`<h2 class="${win?'win':'lose'}">${win?'Victoire !':'Défaite…'}</h2>
   <div class="rew"><div>◆ +${ess} essence${first?' <b style="color:var(--gold)">(première victoire ×2)</b>':''}</div><div>✦ +${xp} XP pour chaque membre de l'équipe</div>
   ${unl.map(u=>`<div>🗺️ Nouveau biome débloqué : <b>${u}</b></div>`).join('')}${ev.map(m=>`<div>${m}</div>`).join('')}
   ${!win?'<div class="mut">Astuce : entraîne tes créatures, joue sur les avantages d\'éléments et lance les pouvoirs au bon moment.</div>':''}</div>
   <div class="acts">${win?'<button class="btn" id="rNext">Bataille suivante</button>':''}<button class="btn sec" id="rAgain">Rejouer</button><button class="btn sec" id="rOut">Quitter</button></div>`);
  $('#rOut').onclick=closeBattle;$('#rAgain').onclick=()=>{closeBattle();startBattle(n)};const nx=$('#rNext');if(nx)nx.onclick=()=>{closeBattle();startBattle(n+1)}}

/* ================= Boucle principale ================= */
let T=0,last=performance.now();
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;T+=dt;
  try{simViv(dt);if(B){bUpdate(dt);if(B)bDraw()}else if(cur==='viv')drawViv();
    const ts=now/1000;for(const k of[cur,'sheet','modal'])if(anims[k])for(const f of anims[k])f(ts)}catch(err){console.error(err)}
  requestAnimationFrame(frame)}
function tick(){updEss();tickEggs();const na=isNightAmt();$('#dn').textContent=na>.25?'☾ Nuit':'☀ Jour'}
function init(){
  if(location.hash==='#icon'){document.body.innerHTML='<canvas id="ic" width="512" height="512" style="position:fixed;left:0;top:0;width:512px;height:512px"></canvas>';const x=$('#ic').getContext('2d');
    const gr=x.createRadialGradient(256,300,40,256,256,360);gr.addColorStop(0,'#4a2f86');gr.addColorStop(1,'#0d0b16');x.fillStyle=gr;x.fillRect(0,0,512,512);
    const g={el:[0,4],m:0,horns:3,tail:2,wings:1,eyes:2,pat:1,hue:0,size:1,stats:{hp:9,atk:9,def:8,spd:9},temp:3};drawCreature(x,g,2,292,400,5.6,0.9,{f:1});return}
  if(!load())newGame();
  const away=(Date.now()-S.lastSeen)/1000;
  if(away>120){const m=Math.min(away,8*3600);S.crea.forEach(c=>{c.hunger=Math.max(35,c.hunger-m*.1);c.energy=clamp(c.energy+m*.02,0,100);c.social=Math.max(30,c.social-m*.06)});
    const rd=S.eggs.filter(e=>e.ready<=Date.now()).length;setTimeout(()=>toast(`Bon retour ! ${rd?`${rd} œuf${rd>1?'s sont prêts':' est prêt'} à éclore.`:'Tes créatures t\'attendaient.'}`),600)}
  renderChips();vResize();updEss();tick();setInterval(tick,1000);setInterval(save,10000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});window.addEventListener('pagehide',save);
  window.addEventListener('resize',()=>{if(cur==='viv')vResize();if(B)bResize()});
  setTimeout(hideHint,9000);
  if(!S.intro){S.intro=true;save();openModal(`<h2>Bienvenue dans Genèse</h2><p class="mut sm">Trois créatures t'attendent déjà dans le vivarium.</p><ul class="intro">
    <li><b>Vivarium</b> : elles vivent seules — mangent, dorment, jouent, se disputent et finissent par pondre quand elles s'entendent bien. Touche le sol pour leur donner un fruit.</li>
    <li><b>Œufs</b> : dépense ton essence ◆ en tirages et fais éclore de nouvelles créatures.</li>
    <li><b>Génétique</b> : chaque petit mélange les gènes de ses parents. Croise des éléments différents pour créer des hybrides et compléter les 105 espèces du bestiaire.</li>
    <li><b>Évolution</b> : aux niveaux 6 et 14, une créature évolue — et peut muter selon le biome où elle a vécu.</li>
    <li><b>Combats</b> : forme une équipe de 3 et avance dans la campagne pour gagner de l'essence et débloquer de nouveaux biomes.</li></ul><button class="btn" id="iOk" style="width:100%">C'est parti !</button>`);$('#iOk').onclick=closeModal}
  requestAnimationFrame(frame);
  if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}
init();
</script>
</body>
