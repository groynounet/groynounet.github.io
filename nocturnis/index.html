<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Nocturnis</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nocturnis">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07050a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Cormorant+Garamond:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07050a;--panel:#120d16;--panel2:#1c141f;--line:#3a2833;--txt:#ece4d8;--mut:#a3958c;--gold:#d9b45a;--blood:#b3122e;--ok:#6fd39a;--bad:#ff5a6a;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);--cz:'Cinzel',Georgia,serif;--cg:'Cormorant Garamond',Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.38 -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block;max-width:100%}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% -10%,#2a0c16 0%,#07050a 55%)}
header{padding:calc(var(--st) + 7px) 12px 7px;display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:5;border-bottom:1px solid #22161c;background:rgba(7,5,10,.85)}
.logo{font-family:var(--cz);font-weight:800;letter-spacing:.16em;font-size:17px;color:var(--gold);text-shadow:0 0 12px rgba(217,180,90,.35);flex:none;cursor:pointer;touch-action:manipulation}
.hdr{display:flex;gap:6px;align-items:center;min-width:0;flex-shrink:1}
header .pill.cur{min-width:0;overflow:hidden}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:5px 10px;font-size:13px;white-space:nowrap}
.cur{display:flex;gap:9px}
.cur b{font-weight:700}.cur .l b{color:#ff8fa3}.cur .g b{color:var(--gold)}.cur .s b{color:#ff5a6a}
.hb{border:1px solid var(--line);background:var(--panel2);border-radius:12px;min-width:34px;height:31px;position:relative;font-size:15px;padding:0 6px;flex:none}
.lvb{font-size:12px;font-weight:800;color:var(--gold);font-family:var(--cz)}
.hb .dot,.nav-dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:#ff3b5c;box-shadow:0 0 8px #ff3b5c}
main{flex:1;position:relative;overflow:hidden;min-height:0}
.screen{position:absolute;inset:0;overflow-y:auto;padding:14px 14px 30px;display:none;-webkit-overflow-scrolling:touch}
.screen.on{display:block}
.wrap{max-width:1180px;margin:0 auto}
nav{display:flex;background:rgba(14,10,17,.96);border-top:1px solid var(--line);padding-bottom:var(--sb);z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mut);position:relative;font-family:var(--cz);letter-spacing:.03em}
nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gold)}
nav .nav-dot{top:5px;right:auto;left:calc(50% + 8px);width:9px;height:9px}
h2{font-family:var(--cz);font-size:21px;margin:2px 0 12px;color:#f1e3c4;letter-spacing:.04em}
h3{font-family:var(--cz);font-size:12.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--gold);margin:22px 0 10px;opacity:.85}
h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);margin:16px 0 6px}
.mut{color:var(--mut)} .sm{font-size:12.5px}
.story{font-family:var(--cg);font-style:italic;font-size:18px;line-height:1.45;color:#e9dcc6}
.card{background:linear-gradient(180deg,#160f19,#100b13);border:1px solid var(--line);border-radius:14px;padding:13px;position:relative}
.card.gold{border-color:#5b4521;box-shadow:0 0 0 1px rgba(217,180,90,.12) inset}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid #6e1426;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14.5px;background:linear-gradient(#8a1428,#5c0c1b);color:#fbe9ec;font-family:var(--cz);letter-spacing:.04em;box-shadow:0 2px 10px rgba(179,18,46,.25)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.btn.sec{background:var(--panel2);border-color:var(--line);box-shadow:none;color:var(--txt)}
.btn.gold{background:linear-gradient(#e8c66e,#a77c2c);border-color:#8a6420;color:#1e1305}
.btn:disabled{opacity:.4;filter:grayscale(.4)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:9px}
.hc{position:relative;cursor:pointer;border-radius:10px;overflow:hidden;background:#000}
.hc img{width:100%;aspect-ratio:3/4}
.hc .nm{position:absolute;left:0;right:0;bottom:0;padding:14px 5px 5px;font-family:var(--cz);font-size:11px;font-weight:700;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.92));text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc .lv{position:absolute;top:7px;left:8px;font-size:10.5px;font-weight:800;background:rgba(0,0,0,.65);border-radius:6px;padding:1px 5px}
.hc .ev{position:absolute;top:7px;right:8px;font-size:10px;color:#ff8fa3;background:rgba(0,0,0,.65);border-radius:6px;padding:1px 5px}
.hc .tm{position:absolute;top:26px;left:8px;font-size:10px;background:var(--blood);border-radius:6px;padding:1px 5px}
.hc.lock img{filter:brightness(.12) grayscale(1)}
.hc.lock .nm{color:#6b5d63}
.hc.sel{outline:2px solid var(--gold);outline-offset:-2px}
.tabs{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:700;font-size:12.5px;color:var(--mut);font-family:var(--cz)}
.tabs button.on{background:linear-gradient(#8a1428,#5c0c1b);color:#fbe9ec}
.sorts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sorts button{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:5px 10px;font-size:12px}
.sorts button.on{background:var(--gold);color:#1e1305;border-color:var(--gold)}
.chip{font-size:11.5px;padding:3px 8px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.bar{height:7px;background:#050306;border-radius:4px;overflow:hidden;margin:6px 0 4px;border:1px solid #2a1c22}
.bar b{display:block;height:100%;background:linear-gradient(90deg,#8a1428,#ff5a6a)}
.bar.g b{background:linear-gradient(90deg,#8a6420,#e8c66e)}
.sb{display:grid;grid-template-columns:70px 1fr 60px;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.sb em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
#sheetBg,#modalBg{position:fixed;inset:0;background:rgba(2,1,4,.72);z-index:20;display:flex;align-items:flex-end}
#modalBg{align-items:center;justify-content:center;z-index:30;padding:16px}
#sheet{width:100%;max-height:92%;overflow-y:auto;background:linear-gradient(180deg,#17101a,#0e0a11);border-radius:20px 20px 0 0;padding:14px 16px calc(18px + var(--sb));border-top:1px solid #5b4521;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#modal{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:linear-gradient(180deg,#17101a,#0e0a11);border:1px solid #5b4521;border-radius:16px;padding:18px;animation:pop .22s}
#modal.wide{max-width:760px}
@keyframes pop{from{transform:scale(.95);opacity:0}}
.x{border:1px solid var(--line);background:var(--panel2);border-radius:50%;width:32px;height:32px;font-size:14px;flex:none}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.acts .btn{flex:1 1 45%}
.hs-top{display:flex;gap:14px;align-items:flex-start}
.hs-top canvas{width:150px;height:200px;border-radius:10px;flex:none}
.title{font-family:var(--cz);font-size:21px;font-weight:800;color:#f4e6c6;line-height:1.1}
.sub{font-family:var(--cg);font-style:italic;font-size:17px;color:#cdb9a0}
.evg{display:flex;gap:4px;margin-top:6px}
.evg i{width:14px;height:14px;transform:rotate(45deg);border:1px solid #6e1426;background:#1a0d12;display:block}
.evg i.on{background:linear-gradient(135deg,#ff6a80,#8a1428);box-shadow:0 0 8px #ff3b5c}
.skill{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13px;margin-top:6px}
.skill b{font-family:var(--cz);color:var(--gold)}
.relic{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
.ric{width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;border:1px solid var(--line);background:radial-gradient(circle,#2a1820,#0b070c)}
.rc{background:linear-gradient(180deg,#160f19,#100b13);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;cursor:pointer;position:relative}
.rc .ric{width:56px;height:56px;font-size:30px}
.rc b{font-family:var(--cz);font-size:12px}
.rc .lv{position:absolute;top:6px;right:8px;font-size:10px;color:#ff8fa3}
.banner{position:relative;border-radius:16px;overflow:hidden;border:1px solid #5b4521;background:#000}
.banner canvas{width:100%;height:auto;display:block}
.banner .bi{position:absolute;left:14px;bottom:12px;right:14px}.banner .bi.hp{right:46%}
.banner .bt{font-family:var(--cz);font-weight:800;font-size:22px;color:#fff3dc;text-shadow:0 2px 8px #000}
.pulls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pulls .btn{padding:12px 8px;font-size:14px}
.pulls small{display:block;font-family:-apple-system,system-ui,sans-serif;font-weight:600;font-size:11.5px;opacity:.85;margin-top:2px;letter-spacing:0}
.team5{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:460px}
.slot{border:1px dashed var(--line);border-radius:10px;min-height:120px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;cursor:pointer;position:relative;overflow:hidden;background:#0b070d}
.slot img{width:100%;aspect-ratio:3/4}
.slot .rw{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:10px;font-family:var(--cz);text-shadow:0 1px 2px #000}
.rowlab{grid-column:1/-1;font-family:var(--cz);font-size:11px;color:var(--gold);letter-spacing:.12em;margin-top:4px}
.stg{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:linear-gradient(180deg,#160f19,#100b13);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.stg .num{width:34px;height:34px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;font-family:var(--cz);border:1px solid var(--line)}
.stg.boss .num{background:#3d0b16;color:#ffb3bf;border-color:#6e1426}
.stg .bi{flex:1;min-width:0}.stg .bi b{display:block;font-family:var(--cz);font-size:14px}.stg .bi small{color:var(--mut);font-size:12px}
.stg.done .st{color:var(--ok)}.stg.open{border-color:#8a6420;box-shadow:0 0 0 1px rgba(217,180,90,.25) inset}.stg.lock{opacity:.42}
.chaps{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.chaps::-webkit-scrollbar{display:none}
.chp{flex:none;width:150px;border-radius:12px;overflow:hidden;border:1px solid var(--line);cursor:pointer;position:relative;background:#000}
.chp canvas{width:150px;height:84px;display:block}
.chp span{position:absolute;left:8px;bottom:6px;right:8px;font-family:var(--cz);font-size:11px;font-weight:700;text-shadow:0 1px 3px #000}
.chp.on{border-color:var(--gold)}.chp.lock{opacity:.4}
.q{background:var(--panel2);border-radius:10px;padding:10px;margin-top:8px;display:flex;gap:10px;align-items:center;font-size:13px;border:1px solid var(--line)}
.q .f{flex:1}.q.done{opacity:.5}
.calg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cd{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px 2px;text-align:center;font-size:10px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;line-height:1.15}
.cd .ic{font-size:17px}.cd .dn{position:absolute;top:2px;left:5px;font-size:9px;color:var(--mut)}
.cd.got{opacity:.38}.cd.got::after{content:'✓';position:absolute;top:2px;right:5px;color:var(--ok);font-weight:900}
.cd.now{border-color:var(--gold);box-shadow:0 0 12px rgba(217,180,90,.5)}
.cd.big{background:linear-gradient(160deg,#4a1020,#1c141f);border-color:#ff3b5c}
.ul{list-style:none;padding:0;margin:8px 0}.ul li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.home-hero{position:relative;border-radius:16px;overflow:hidden;border:1px solid #3a2128;background:#000;margin:-2px 0 12px}
.home-hero canvas{width:100%;display:block}
.home-hero .ov{position:absolute;left:0;right:0;top:0;padding:12px 14px 30px;background:linear-gradient(rgba(0,0,0,.75),transparent)}
.hgrid{display:grid;gap:10px}
.tile{display:flex;gap:12px;align-items:center}
.tile .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;background:radial-gradient(circle,#3a1420,#120a0e);border:1px solid #5b2030}
.tile .f{flex:1;min-width:0}
.tile b{font-family:var(--cz)}
#sum{position:fixed;inset:0;z-index:25;background:#000;display:flex;flex-direction:column}
#sum canvas{position:absolute;inset:0;width:100%;height:100%}
#sumRes{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--st) + 14px) 12px calc(var(--sb) + 14px);overflow:auto}
.rgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:640px}
.rgrid.one{grid-template-columns:1fr;max-width:220px}
.rcard{perspective:800px;aspect-ratio:3/4;position:relative}
.rcard .in{position:absolute;inset:0;transition:transform .55s;transform-style:preserve-3d}
.rcard.f .in{transform:rotateY(180deg)}
.rcard .fa,.rcard .fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:8px;overflow:hidden}
.rcard .fa{background:linear-gradient(160deg,#2a0c16,#0b0508);border:1px solid #5b2030;display:flex;align-items:center;justify-content:center;font-size:22px;color:#7a2a3a}
.rcard .fb{transform:rotateY(180deg)}
.rcard .fb img{width:100%;height:100%}
.rcard .tag{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:9.5px;font-weight:800;font-family:var(--cz);text-shadow:0 1px 3px #000}
.rcard.r5 .fa{box-shadow:0 0 18px #e6b84a}.rcard.r6 .fa{box-shadow:0 0 22px #ff3b5c}.rcard.r4 .fa{box-shadow:0 0 12px #a46ad9}
.sumbar{position:relative;z-index:2;display:flex;gap:8px;justify-content:center;padding:0 12px calc(var(--sb) + 16px)}
#battle{position:fixed;inset:0;z-index:15;background:#030204}
.bw{height:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column;background:#000}
.btop{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:calc(var(--st) + 6px) 10px 6px;background:var(--bg);border-bottom:1px solid #22161c}
#bTitle{font-family:var(--cz);font-weight:800;font-size:14px;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f1e3c4}
.bb{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:5px 10px;font-weight:800;font-size:12.5px;font-family:var(--cz)}
.bb.on{background:var(--gold);color:#1e1305}.bb.lk{opacity:.4}
#bcan{flex:1;width:100%;display:block;min-height:0;touch-action:none}
#bhint{text-align:center;font-size:11.5px;color:var(--mut);padding:6px 10px calc(8px + var(--sb));background:var(--bg)}
#toasts{position:fixed;top:calc(var(--st) + 52px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:40;pointer-events:none}
.toast{background:rgba(24,15,20,.97);border:1px solid #5b4521;padding:8px 14px;border-radius:12px;font-size:13px;max-width:min(92%,520px);box-shadow:0 6px 20px rgba(0,0,0,.6);animation:tin .3s;transition:opacity .4s,transform .4s;text-align:center}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
.rew{display:flex;flex-direction:column;gap:6px;margin:10px 0}.rew div{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13.5px}
.win{color:var(--gold);text-align:center;font-family:var(--cz);font-size:26px}.lose{color:var(--bad);text-align:center;font-family:var(--cz);font-size:26px}
.gmg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}.gmg .btn{font-size:12.5px;padding:9px 10px}
.gmsel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.gmsel select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:7px 8px;font:inherit;font-size:13px;max-width:100%}
.shopg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.sh{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.sh .ic{font-size:30px}
.soon{opacity:.55;border-style:dashed}
@media (max-width:430px){header{padding-left:9px;padding-right:9px}.logo{font-size:12px;letter-spacing:.04em}.hdr{gap:4px}.cur{gap:5px}.pill{padding:4px 7px;font-size:11.5px}.hb{min-width:29px;height:29px;padding:0 3px;font-size:13px}.lvb{font-size:11px}}
@media (min-width:860px){
  #app{display:grid;grid-template-columns:100px 1fr;grid-template-rows:auto 1fr}
  header{grid-column:1/3;grid-row:1;padding:12px 22px}
  .logo{font-size:21px}
  nav{grid-column:1;grid-row:2;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding:12px 0;gap:4px}
  nav button{flex:none;padding:13px 0;font-size:11.5px}nav button svg{width:26px;height:26px}
  main{grid-column:2;grid-row:2}
  .screen{padding:24px 32px 40px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .hgrid{grid-template-columns:1fr 1fr}
  #sheetBg{justify-content:flex-end;align-items:stretch}
  #sheet{width:500px;max-height:none;height:100%;border-radius:0;border-top:0;border-left:1px solid #5b4521;animation:side .25s;padding:20px}
  @keyframes side{from{transform:translateX(40px);opacity:0}}
  .calg{grid-template-columns:repeat(10,1fr)}
  .home-split{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
}
</style>
</head>
<body>
<div id="app">
  <header><div class="logo" id="logo">NOCTURNIS</div><div class="hdr">
    <button class="pill cur" id="hCur"><span class="l">◆<b id="cL">0</b></span><span class="g">●<b id="cG">0</b></span><span class="s">🩸<b id="cS">0</b></span></button>
    <button class="hb" id="hCal">🎁<i class="dot hidden" id="dCal"></i></button>
    <button class="hb" id="hQ">📜<i class="dot hidden" id="dQ"></i></button>
    <button class="hb lvb" id="hAcc">Nv <span id="accL">1</span></button>
    <button class="hb hidden" id="hGM">🛠️</button>
  </div></header>
  <main>
    <section id="home" class="screen on"></section>
    <section id="heroes" class="screen"></section>
    <section id="summon" class="screen"></section>

  for(const[rr,sp]of[[R0,.2],[R0*.86,-.3],[R0*.5,.5]]){ctx.save();ctx.rotate(t*sp*(1+k*6));ctx.beginPath();ctx.arc(0,0,rr,0,TAU);ctx.stroke();for(let i=0;i<18;i++){ctx.rotate(TAU/18);ctx.fillStyle=hexA(col,.8);ctx.fillRect(-2,-rr-8,4,8)}ctx.restore()}
  ctx.save();ctx.rotate(-t*.15*(1+k*5));ctx.beginPath();for(let i=0;i<=7;i++){const a=-Math.PI/2+i*TAU*3/7;ctx.lineTo(Math.cos(a)*R0*.86,Math.sin(a)*R0*.86)}ctx.stroke();ctx.restore();ctx.restore();
  for(let i=0;i<7;i++){const a=i*TAU/7-Math.PI/2,x=cx+Math.cos(a)*R0*1.15,y=cy+Math.sin(a)*R0*.62;ctx.fillStyle='#d8ccb0';ctx.fillRect(x-4,y-26,8,26);const fl=1+Math.sin(t*12+i)*.2;const fg=ctx.createRadialGradient(x,y-32,1,x,y-32,24);fg.addColorStop(0,hexA(col,.7));fg.addColorStop(1,hexA(col,0));ctx.fillStyle=fg;ctx.fillRect(x-24,y-56,48,48);ctx.fillStyle='#fff3d0';ctx.beginPath();ctx.ellipse(x,y-32,3.5,8*fl,0,0,TAU);ctx.fill()}
  for(let i=0;i<40;i++){const ph=(t*(.3+k)+i*.025)%1,a=i*2.4+t*(1+k*4),rr=R0*1.6*(1-ph);ctx.fillStyle=hexA(col,ph*.9);ctx.beginPath();ctx.arc(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*.55,1.5+ph*2,0,TAU);ctx.fill()}}

function rollHero(b){const pc=b==='ev'?'ev':'std';S.pity[pc]++;S.pity.four++;let r;const x=R()*100;
  if(S.pity[pc]>=80||x<2.1)r=5;else if(S.pity.four>=10||x<15.1)r=4;else r=3;

  return pick(POOL[r])}

function openProfile(){const L=S.acc.lvl;openModal(`${head2("L'Invocateur · niveau "+L)}<div class="bar g"><b style="width:${S.acc.xp/accNeed(L)*100}%"></b></div><div class="mut sm">${S.acc.xp}/${accNeed(L)} XP — chaque niveau rapporte 200 Larmes.</div>

$('#logo').addEventListener('pointerup',()=>{gmT++;clearTimeout(gmTm);gmTm=setTimeout(()=>gmT=0,2500);if(gmT>=5){gmT=0;S.gm=!S.gm;save();updGM();toast(S.gm?'🛠️ Mode maître du jeu activé':'Mode maître du jeu désactivé');if(S.gm)setTimeout(openGM,400)}});
function updGM(){$('#hGM').classList.toggle('hidden',!S.gm)}$('#hGM').onclick=()=>openGM();
function gmDone(m){updRes();save();refresh();toast('🛠️ '+m)}
function openGM(){openModal(`${head2('🛠️ Maître du jeu')}<p class="mut sm">Tape 5 fois sur le logo NOCTURNIS pour afficher ou masquer ce mode, ou ouvre le lien avec ?mj.</p>

   <button class="btn" data-g="cal">🎁 Rejouer le jour du calendrier</button><button class="btn" data-g="cal28">★ Aller au jour 28</button><button class="btn" data-g="q">📜 Valider les quêtes du jour</button>
   <button class="btn" data-g="pass">🎫 Pass : +10 paliers</button><button class="btn" data-g="pity">🎲 Pitié à 79 (5★ au prochain tirage)</button><button class="btn" data-g="first">🎟️ Réactiver le ×10 offert</button>
   <button class="btn sec" data-g="off">Désactiver le mode maître du jeu</button></div>`,true);
  $('#gHg').onclick=()=>{const i=+$('#gH').value;S.heroes[i]={lvl:+$('#gLv').value,ev:+$('#gEv').value,relic:S.heroes[i]?S.heroes[i].relic:null};gmDone(HD[i].n+' ajouté')};

/* ===================== Musique & sons (synthétisés) ===================== */
const AU={ctx:null,mus:null,sfx:null,rev:null,track:null,next:0,step:0,timer:null};
const mf=m=>440*Math.pow(2,(m-69)/12);
function audioInit(){if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const c=AU.ctx=new AC();
  const master=c.createGain();master.gain.value=.9;master.connect(c.destination);
  const len=c.sampleRate*2.8,ib=c.createBuffer(2,len,c.sampleRate);for(let ch=0;ch<2;ch++){const d=ib.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
  AU.rev=c.createConvolver();AU.rev.buffer=ib;const rg=c.createGain();rg.gain.value=.55;AU.rev.connect(rg);rg.connect(master);
  AU.mus=c.createGain();AU.mus.connect(master);AU.mus.connect(AU.rev);AU.sfx=c.createGain();AU.sfx.connect(master);const sr=c.createGain();sr.gain.value=.3;AU.sfx.connect(sr);sr.connect(AU.rev);
  volSync();AU.timer=setInterval(sched,90);musicFor()}
function volSync(){if(!AU.ctx)return;const t=AU.ctx.currentTime;AU.mus.gain.setTargetAtTime(S.snd.m?.32:0,t,.3);AU.sfx.gain.setTargetAtTime(S.snd.s?.7:0,t,.05)}
['pointerdown','keydown'].forEach(ev=>window.addEventListener(ev,()=>audioInit(),{passive:true}));
document.addEventListener('visibilitychange',()=>{if(!AU.ctx)return;document.hidden?AU.ctx.suspend():AU.ctx.resume()});
function tone(f,t0,dur,o){o=o||{};const c=AU.ctx,os=c.createOscillator(),g=c.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t0);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t0+dur);if(o.det)os.detune.value=o.det;
  const a=o.a||.01,v=o.v||.3;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+a);g.gain.setTargetAtTime(0,t0+Math.max(a,dur*(o.hold||.3)),dur*(o.rel||.35));
  let n=os;if(o.lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;fl.Q.value=o.q||.7;os.connect(fl);n=fl}n.connect(g);g.connect(o.out||AU.sfx);os.start(t0);os.stop(t0+dur*2.5+.1)}
function noise(t0,dur,o){o=o||{};const c=AU.ctx,b=c.createBuffer(1,Math.ceil(c.sampleRate*dur),c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const sN=c.createBufferSource();sN.buffer=b;
  const f=c.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f||1200,t0);if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,t0+dur);f.Q.value=o.q||1;const g=c.createGain();g.gain.setValueAtTime(o.v||.3,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  sN.connect(f);f.connect(g);g.connect(o.out||AU.sfx);sN.start(t0)}
function bell(m,t0,v,out){[1,2.76,5.4,8.9].forEach((h,i)=>tone(mf(m)*h,t0,2.6/(i+1),{v:(v||.12)/(i+1.4),a:.005,hold:.02,rel:.6,out}))}
const TRK={
 hall:{bpm:56,bars:[[50,53,57],[46,50,53],[43,46,50],[45,49,52]],scale:[62,64,65,67,69,70,72,74]},
 battle:{bpm:118,bars:[[50,53,57],[50,53,57],[46,50,53],[48,52,55]],scale:[62,65,67,69,70,72,74,77]},
 summon:{bpm:50,bars:[[38,45,50],[38,44,50]],scale:[74,77,81]}};
function musicFor(){const want=B?'battle':SUM?'summon':'hall';if(AU.track!==want){AU.track=want;AU.step=0;if(AU.ctx)AU.next=AU.ctx.currentTime+.1}}
function sched(){if(!AU.ctx||AU.ctx.state!=='running'||!S.snd.m)return;musicFor();const c=AU.ctx,T=TRK[AU.track],beat=60/T.bpm;
  while(AU.next<c.currentTime+.4){const t=AU.next,st=AU.step,bar=Math.floor(st/4)%T.bars.length,b=st%4,ch=T.bars[bar],out=AU.mus;
    if(AU.track==='battle'){tone(70,t,.25,{to:38,v:b%2?.35:.6,a:.002,hold:.05,out});if(b%2)noise(t,.12,{f:900,v:.18,out});
      for(let k=0;k<2;k++){const nt=ch[(st*2+k)%3]+12;tone(mf(nt),t+k*beat/2,beat*.45,{type:'sawtooth',lp:1400,v:.06,a:.005,hold:.2,out})}
      if(b===0)ch.forEach(n=>tone(mf(n),t,beat*4,{type:'sawtooth',lp:500,v:.05,a:.2,hold:.7,out,det:(Math.random()-.5)*12}));
      if(b===2&&Math.random()<.5)tone(mf(pick(T.scale)),t,beat*1.8,{type:'triangle',v:.07,a:.05,out})}
    else{if(b===0)ch.forEach(n=>{for(const dt of[-7,7])tone(mf(n),t,beat*4.2,{type:'sawtooth',lp:AU.track==='summon'?420:720,v:.045,a:1.2,hold:.75,rel:.5,det:dt,out})});
      if(b===0)tone(mf(ch[0]-12),t,beat*4,{type:'triangle',v:.12,a:.8,hold:.8,out});
      if(AU.track==='hall'&&b%2===0&&Math.random()<.55)tone(mf(pick(T.scale)),t+(Math.random()<.5?0:beat/2),beat*1.6,{type:'triangle',v:.06,a:.08,hold:.4,out});
      if(b===0&&st%8===0&&Math.random()<.7)bell(pick(T.scale)+12,t+beat,.08,out)}
    AU.next+=beat;AU.step++}}
const SFX={
 tap(){const t=AU.ctx.currentTime;tone(1200,t,.05,{v:.06,a:.002,hold:.1})},
 hit(big){const t=AU.ctx.currentTime;noise(t,big?.22:.12,{f:big?700:1500,to:200,v:big?.4:.25,q:.8});tone(big?110:160,t,.15,{to:50,v:.25,a:.002,hold:.1})},
 crit(){const t=AU.ctx.currentTime;bell(88,t,.1);SFX.hit(true)},
 ult(e){const t=AU.ctx.currentTime;noise(t,.6,{f:300,to:4000,v:.25,q:.7});const base=[50,47,57,54,45][e];[0,3,7,12].forEach((k,i)=>tone(mf(base+k+12),t+.05+i*.04,.9,{type:'sawtooth',lp:2200,v:.07,a:.01,hold:.3}))},
 heal(){const t=AU.ctx.currentTime;[74,78,81,86].forEach((m,i)=>tone(mf(m),t+i*.07,.5,{type:'sine',v:.09,a:.01}))},
 death(){const t=AU.ctx.currentTime;tone(220,t,.7,{to:55,type:'sawtooth',lp:600,v:.12,a:.01,hold:.3})},
 coin(){const t=AU.ctx.currentTime;tone(mf(88),t,.15,{v:.1,a:.002});tone(mf(93),t+.08,.3,{v:.1,a:.002})},
 lvl(){const t=AU.ctx.currentTime;[62,66,69,74].forEach((m,i)=>tone(mf(m),t+i*.06,.4,{type:'triangle',v:.1,a:.005}))},
 charge(){const t=AU.ctx.currentTime;noise(t,1.9,{f:200,to:3000,v:.22,q:2});tone(55,t,2,{to:110,type:'sawtooth',lp:300,v:.12,a:.5,hold:.8})},
 reveal(r){const t=AU.ctx.currentTime;if(r>=5){[50,57,62,65,69,74].forEach((m,i)=>tone(mf(m),t+i*.02,2.4,{type:'sawtooth',lp:1800,v:.05,a:.05,hold:.6}));bell(r===6?86:81,t,.16);bell(r===6?93:88,t+.2,.12)}else if(r===4){bell(81,t,.1);bell(84,t+.1,.08)}else tone(mf(74),t,.25,{v:.07,a:.003})},
 win(){const t=AU.ctx.currentTime;[[50,54,57],[52,55,59],[54,57,62]].forEach((c,i)=>c.forEach(m=>tone(mf(m+12),t+i*.32,i===2?1.8:.4,{type:'sawtooth',lp:2400,v:.06,a:.01,hold:.5})));bell(86,t+.64,.12)},
 lose(){const t=AU.ctx.currentTime;[62,61,58,53].forEach((m,i)=>tone(mf(m),t+i*.35,.7,{type:'triangle',v:.1,a:.02}))}};
function sfx(k,...a){if(!AU.ctx||!S||!S.snd.s||AU.ctx.state!=='running')return;try{SFX[k](...a)}catch(e){}}

/* ===================== Boucle ===================== */
let last=performance.now();
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;const ts=now/1000;
  try{if(B){bUpdate(dt);if(B)bDraw()}if(SUM&&SUM.draw)SUM.draw(ts);const keys=(B||SUM)?['modal']:[cur,'sheet','modal'];for(const k of keys){const L=anims[k];if(L)for(const f of L)f(ts)}}catch(e){console.error(e)}
  requestAnimationFrame(frame)}

  document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});window.addEventListener('pagehide',save);
  window.addEventListener('resize',()=>{if(B)bResize()});
  if(!S.intro){S.intro=true;save();openModal(`<div style="text-align:center"><div class="mut sm" style="font-family:var(--cz);letter-spacing:.25em">PROLOGUE</div><h2 style="font-size:26px">Nocturnis</h2></div>
   <p class="story">Il y a mille ans, le soleil s'est éteint. Depuis, la Nuit règne et les morts ne reposent plus.</p><p class="story">Toi, dernier Invocateur, tu veilles sur l'ultime cathédrale. Par les Larmes des saints, tu peux rappeler les âmes des héros oubliés… et les damnés aussi.</p><p class="story">Reprends le soleil.</p>
   <p class="mut sm">Cinq héros t'accompagnent déjà. Une première invocation ×10 t'est offerte, avec un héros 5★ garanti.</p><button class="btn gold" style="width:100%" id="iGo">Invoquer mes premiers héros</button>`);
   $('#iGo').onclick=()=>{closeModal();S.btab='ev';show('summon')}}
  requestAnimationFrame(frame);
  if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}
init();
</script>
